# For confirming a change that already looked better on core, not for tuning.

- id: channel-members-absent
  ask: "where do i see everyone who joined this channel, not the whole group?"
  kind: cannot
  file: channels.md
  entry: "See who is in a channel"
  must:
    - "says a group channel has no member list of its own"
    - "look at the group members and their roles in Group info & settings"
  must_not:
    - "claims the channel info screen lists its members"

- id: contact-remove-keep-chat
  ask: "how do i remove someone from my contacts without blocking them?"
  kind: how-to
  file: contacts-and-profile.md
  entry: "Add or remove a contact from their profile"
  must:
    - "open their profile and tap Remove Contact"
    - "removing a contact does not block them or delete the DM"

- id: website-alert-refused
  ask: "i'm on the website on my laptop and i refused notifications earlier. how do i allow them now?"
  kind: how-to
  file: desktop.md
  entry: "Turn on notifications in the browser"
  must:
    - "allow notifications for the site in the browser's own settings"
    - "Blocked in browser means the in-app Enable button is gone"

- id: dm-history-clear
  ask: "how do i clear the history in a dm but keep the conversation?"
  kind: cannot
  file: direct-messages.md
  entry: "Leave or delete a DM"
  must:
    - "says the app cannot clear a DM's history"
    - "leaving is the only way to remove a DM from the list"
  must_not:
    - "invents a clear-history action"

- id: gallery-retry-upload
  ask: "a photo in our gallery didn't send. how do i try it again on my phone?"
  kind: how-to
  file: galleries.md
  entry: "A gallery post failed to send"
  must:
    - "tap the red Tap to retry text at the bottom right of its tile"

- id: group-delete-admin-limit
  ask: "i'm an admin but i didn't make this group. can i delete it for everyone?"
  kind: who-can
  file: groups.md
  entry: "Understand the Admin role"
  must:
    - "only the group host sees Delete group"
    - "an admin who is not the host cannot delete the group"

- id: remove-group-message
  ask: "how do i delete one of my messages from our group chat on my phone?"
  kind: how-to
  file: message-actions.md
  entry: "Delete a message"
  must:
    - "press and hold the message, tap Delete message and confirm"
    - "deleting removes the message for everyone"

- id: move-notebook-note
  ask: "how do i move a note into a different folder on my phone? dragging doesn't work"
  kind: how-to
  file: notebooks.md
  entry: "Move a note or a folder"
  must:
    - "press and hold the note and tap Move to folder"
    - "pick a folder and tap the Move to button"
    - "notes cannot be dragged to move them"

- id: notification-default-again
  ask: "how do i undo a special notification setting for one chat on my phone so it follows the default again?"
  kind: how-to
  file: notifications-and-activity.md
  entry: "Go back to the default for a chat"
  must:
    - "Settings, Notifications, then Overrides"
    - "tap the X next to the chat to remove its own level"

- id: phone-app-build-where
  ask: "support asked what build i'm on. where can i find that on my phone?"
  kind: where
  file: settings-and-account.md
  entry: "Find the app version or my node's software version"
  must:
    - "Settings, then App info"
    - "Build version is the app build on this phone"

- id: bot-extra-service-server
  ask: "how do i add my own service server to my hosted bot? i only see a list of services"
  kind: cannot
  file: tlonbot-in-the-app.md
  entry: "Connect an outside service to my bot"
  must:
    - "says you cannot add your own server or paste a token"
    - "connect a listed service by signing in and approving access"
  must_not:
    - "invents a custom-server field"

- id: chat-filter-name
  ask: "where do i look up a chat by name in the phone app?"
  kind: where
  file: workspaces-list.md
  entry: "Find a chat by name"
  must:
    - "tap the magnifying glass at the top right of Workspaces"
    - "type in Filter by name to narrow the list"

- id: audio-from-computer
  ask: "i'm on my laptop, how do i record a voice message here?"
  kind: desktop
  file: writing-messages.md
  entry: "Send a voice message"
  must:
    - "desktop cannot record voice messages"
    - "attach an audio file with the plus icon instead"
  must_not:
    - "offers Voice Memo recording on desktop"

- id: channel-order-admin-changed
  ask: "our admin organized the channels but mine still look random. how do i see their order on my phone?"
  kind: how-to
  file: channels.md
  entry: "The channel order or sections an admin set aren't showing"
  must:
    - "press and hold the group on Workspaces and tap Sort channels"
    - "choose Sort by arrangement"
    - "this is each member's own display setting"

- id: revoke-phone-verification
  ask: "how do i disconnect the verified phone number from my profile on my phone?"
  kind: how-to
  file: contacts-and-profile.md
  entry: "Remove a verified phone number or X account"
  must:
    - "Settings, Your profile, pencil icon, then Phone under Connected Accounts"
    - "tap Revoke at the bottom"

- id: gallery-readonly-comment
  ask: "if a gallery is read only for me can i still comment on the pictures?"
  kind: who-can
  file: galleries.md
  entry: "Who can post in a gallery, and what read-only members see"
  must:
    - "read-only members cannot add comments"
    - "they can still open posts and read comments"

- id: secret-group-request
  ask: "how do i ask to join a secret group if i haven't been invited?"
  kind: cannot
  file: groups.md
  entry: "Ask to join a private group, or cancel the request"
  must:
    - "says you cannot request to join a secret group"
    - "you need an invite"
  must_not:
    - "gives Request invite steps for a secret group"

- id: unhide-chat-message
  ask: "how do i permanently bring back a message i hid on my phone?"
  kind: how-to
  file: message-actions.md
  entry: "Hide a message, or show it again"
  must:
    - "tap Show anyway beside the hidden-message line"
    - "press and hold the revealed message and tap Show message"
    - "Show anyway alone only reveals it temporarily"

- id: note-conflicting-edit
  ask: "my note says someone changed it elsewhere and now it won't save. how do i keep my version?"
  kind: how-to
  file: notebooks.md
  entry: "Two people changed the same note"
  must:
    - "tap Keep mine to save your version over theirs"
    - "saving is paused until you choose"

- id: failed-bot-answer-retry
  ask: "who can retry a bot reply that timed out?"
  kind: who-can
  file: tlonbot-in-the-app.md
  entry: "Ask my bot to try again after a reply failed"
  must:
    - "only the bot's owner can retry"
    - "Retry appears on timed-out, no-reply, aborted or error runs"
