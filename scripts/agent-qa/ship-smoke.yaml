appId: ${MAESTRO_APP_ID}
---
# Kept independent of the exploratory reliability flows so this harness can be
# introduced without changing those journeys. Credentials never go to the model.
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible: '^Tlon Messenger$'
- tapOn: '^Have an account\? Log in$'
- tapOn: '^Or configure self hosted$'
- assertVisible: '^Connect Ship$'
- tapOn:
    id: '^textInput shipUrl$'
- eraseText: 100
- inputText:
    text: ${MAESTRO_LOGIN_URL}
    label: Enter isolated ship URL
- tapOn:
    id: '^textInput accessCode$'
- eraseText: 100
- inputText:
    text: ${MAESTRO_LOGIN_CODE}
    label: Enter isolated ship code
- tapOn: '^Connect$'
- extendedWaitUntil:
    visible: '^(Home|Usage Statistics|Save Password\?)$'
    timeout: 60000
- runFlow:
    when:
      visible: '^Save Password\?$'
    commands:
      - tapOn: '^Not Now$'
- runFlow:
    when:
      visible: '^Usage Statistics$'
    commands:
      - tapOn: '^Next$'
- extendedWaitUntil:
    visible: '^Home$'
    timeout: 60000
- runFlow:
    when:
      visible: '^Contacts$'
    commands:
      - tapOn: '^Contacts$'
- runFlow:
    when:
      notVisible: '^You$'
    commands:
      - tapOn:
          text: '^Tab Bar$'
          point: '71%,38%'
- assertVisible: '^Contacts$'
- tapOn: '^You$'
- assertVisible:
    id: ContactEditButton
- assertVisible: ${MAESTRO_TEST_SHIP_PATTERN}
