appId: io.tlon.groups
---
- tapOn: 'Have an account? Log in'
- tapOn: 'Log in with Email'
- tapOn:
    id: 'Legacy login'
- assertVisible:
    'Enter the email and password associated with your Tlon account.'
# Enter invalid email
- tapOn:
    id: 'email-input'
- inputText: 'invalid-email'
- assertVisible: 'Please enter a valid email address.'
- longPressOn:
    id: 'email-input'
- runFlow:
    when:
      visible: 'Select All'
    commands:
      - tapOn: 'Select All'
- eraseText
- inputText: ${EMAIL}
# Enter invalid password
- tapOn:
    id: 'password-input'
- inputText: 'invalid-password'
- tapOn: 'Submit'
- assertVisible: 'Incorrect email or password.'
- doubleTapOn:
    id: 'password-input'
- runFlow:
    when:
      visible: 'Select All'
    commands:
      - tapOn: 'Select All'
- eraseText
# Log in for real
- tapOn:
    id: 'password-input'
- inputText: ${PASSWORD}
- tapOn: 'Submit'
# Dismiss password save prompt
- runFlow:
    when:
      visible: 'Not now'
    commands:
      - tapOn: 'Not now'
# The sheet can arrive a moment *after* the credentials are accepted, so the
# one-shot check above can run before it exists and leave it to swallow the
# first tap that follows. Give it a window of its own. Case-insensitive: the
# button is "Not Now" on iOS and the older check here spelled it "Not now".
- extendedWaitUntil:
    visible: '(?i)^Save Password\?$'
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: '(?i)^Save Password\?$'
    commands:
      - tapOn: '(?i)^Not Now$'
# Wait if we encounter the ship-restarting screen
- runFlow:
    when:
      visible: 'Notify me when.*'
    commands:
      - extendedWaitUntil:
          notVisible: 'Notify me when.*'
          timeout: 600000 # 10 minutes
