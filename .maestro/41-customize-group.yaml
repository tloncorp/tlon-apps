# Note, this test is currently disabled. It's been replaced by a playwright test.
appId: io.tlon.groups
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/tlon-login.yaml
- assertVisible: 'Workspaces'
# Tap on the "+" button
- tapOn:
    id: 'CreateGroupButton'
# Assert that the sheet pops
- assertVisible: 'Create a customizable workspace'
- tapOn: 'New empty workspace'
# Assert that the contacts sheet pops
- assertVisible: 'Select contacts to invite'
# Create the group
- tapOn: 'Create workspace'
- runFlow:
    when:
      visible: 'Untitled workspace'
    commands:
      - assertVisible: 'Welcome to your workspace!'
# Navigate back to the Workspaces list and assert that the group is created
- tapOn:
    id: 'HeaderBackButton'
- runFlow:
    when:
      visible: 'Workspaces'
    commands:
      - assertVisible: 'Untitled workspace'
      - tapOn: 'Untitled workspace'
      - assertVisible: 'Untitled workspace'
# Open the Customize group screen from the empty "General" channel
- tapOn: 'Customize'
- assertVisible: 'Edit workspace info'
# Change the group name and confirm on the Workspaces list
- tapOn: 'Workspace name'
- inputText: 'My Group'
- 'hideKeyboard'
- tapOn: 'Save'
- tapOn:
    id: 'HeaderBackButton'
- runFlow:
    when:
      visible: 'Workspaces'
    commands:
      - assertVisible: 'My Group'
      - tapOn: 'My Group'
# Change the group icon/picture
- tapOn: 'Customize'
- tapOn: 'Change icon image'
- assertVisible: 'Photo Library'
- swipe:
    direction: 'DOWN'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: 'Save'
# Change the group description
- tapOn: 'Customize'
- tapOn: 'About this workspace'
- inputText: 'This is a test group'
- 'hideKeyboard'
- tapOn: 'Save'
# Delete the group and clean up
- tapOn:
    id: 'ChannelHeaderOverflowMenuButton'
- tapOn: 'Workspace info & settings'
- scrollUntilVisible:
    direction: DOWN
    element:
      text: 'Delete workspace'
- tapOn: 'Delete workspace'
- runFlow:
    when:
      visible: 'This action cannot be undone.'
    commands:
      - tapOn: 'Delete workspace'
- runFlow:
    when:
      visible: 'Workspaces'
    commands:
      - assertVisible: 'Workspaces'
      - assertNotVisible: 'My Group'
# Log out
- tapOn:
    id: 'AvatarNavIcon'
- tapOn:
    id: 'ContactsSettingsButton'
- tapOn: 'Log out'
- tapOn: 'Log out now'
