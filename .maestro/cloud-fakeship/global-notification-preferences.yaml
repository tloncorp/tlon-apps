appId: ${MAESTRO_APP_ID}
name: Global notification preferences affect Activity notification delivery
env:
  JOURNEY: global-notification-preferences
---
- runScript: ../reliability/data.js
- runFlow: begin.yaml
- runFlow: ../reliability/subflows/settings-tab.yaml
- runFlow:
    file: ../reliability/subflows/settings-row.yaml
    env:
      ROW: '^Notifications$'
- assertVisible: '^Notifications$'
- assertVisible: '^All DMs and group posts$'
- assertVisible: '^DMs, mentions, and replies only$'
- assertVisible: '^Nothing$'
- tapOn: '^DMs, mentions, and replies only$'
- runFlow: ../reliability/subflows/to-tab-root.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: '^Tab Bar$'
          point: '50%,38%'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: '^Activity.*$'
- assertVisible:
    id: ScreenHeaderTitle
    text: '^Activity$'
- extendedWaitUntil:
    visible: ${'.*' + MAESTRO_RUN_TAG + ' notification soft mention.*'}
    timeout: 30000
- assertVisible: ${'.*' + MAESTRO_RUN_TAG + ' notification soft reply.*'}
- runFlow: ../reliability/subflows/settings-tab.yaml
- runFlow:
    file: ../reliability/subflows/settings-row.yaml
    env:
      ROW: '^Notifications$'
- tapOn: '^Nothing$'
- runFlow: ../reliability/subflows/workspaces-tab.yaml
- extendedWaitUntil:
    visible: ${'.*' + MAESTRO_RUN_TAG + ' notification hush delivered.*'}
    timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: '^Tab Bar$'
          point: '50%,38%'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: '^Activity.*$'
- assertVisible:
    id: ScreenHeaderTitle
    text: '^Activity$'
- assertVisible: ${'.*' + MAESTRO_RUN_TAG + ' notification hush mention.*'}
- assertVisible: ${'.*' + MAESTRO_RUN_TAG + ' notification hush reply.*'}
- runFlow: ../reliability/subflows/settings-tab.yaml
- runFlow:
    file: ../reliability/subflows/settings-row.yaml
    env:
      ROW: '^Notifications$'
- tapOn: '^All DMs and group posts$'
- runFlow: ../reliability/subflows/workspaces-tab.yaml
- assertVisible: '^Workspaces$'
