appId: ${MAESTRO_APP_ID}
name: Suppress shared-group posts from a blocked peer
env:
  JOURNEY: blocked-group-content
---
- runScript: ../reliability/data.js
- runFlow: begin.yaml
- runFlow: ../reliability/subflows/settings-tab.yaml
- runFlow:
    file: ../reliability/subflows/settings-row.yaml
    env:
      ROW: '^Blocked users$'
- assertVisible: '^Blocked users$'
- assertVisible: '^(~ten|ten)$'
- runFlow: ../reliability/subflows/workspaces-tab.yaml
- scrollUntilVisible:
    element: ${'BlockedContent-' + MAESTRO_RUN_TAG}
    direction: UP
    timeout: 30000
- tapOn: ${'BlockedContent-' + MAESTRO_RUN_TAG}
- extendedWaitUntil:
    visible: ${MAESTRO_RUN_TAG + ' blocker control post'}
    timeout: 30000
- assertNotVisible: ${MAESTRO_RUN_TAG + ' blocked group post'}
- tapOn: '^Back$'
- assertVisible:
    id: ScreenHeaderTitle
    text: '^Workspaces$'
