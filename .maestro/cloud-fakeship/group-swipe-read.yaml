appId: ${MAESTRO_APP_ID}
name: Swipe an unread group to mark it read
env:
  JOURNEY: group-swipe-read
---
- runScript: ../reliability/data.js
- runFlow: begin.yaml
- tapOn: '^All$'
- scrollUntilVisible:
    element:
      id: ${'ChatListItem-SwipeGroup-' + MAESTRO_RUN_TAG + '-unpinned'}
    direction: DOWN
    timeout: 5000
    centerElement: true
- assertVisible: ${output.reliability.groupSwipePreviewPattern}
- assertVisible:
    text: '^1$'
    below:
      text: ${output.reliability.groupSwipeTitlePattern}
    rightOf:
      text: ${output.reliability.groupSwipePreviewPattern}
- swipe:
    from:
      id: ${'ChatListItem-SwipeGroup-' + MAESTRO_RUN_TAG + '-unpinned'}
    direction: RIGHT
    duration: 500
- tapOn:
    # Fresh activity sorts the fixture first; this point is the center of the
    # revealed 80pt action in the top row on the native Home layout.
    point: '10%,27%'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: ${'ChatListItem-SwipeGroup-' + MAESTRO_RUN_TAG + '-unpinned'}
- assertVisible: ${output.reliability.groupSwipePreviewPattern}
- longPressOn:
    id: ${'ChatListItem-SwipeGroup-' + MAESTRO_RUN_TAG + '-unpinned'}
- assertVisible: '^Group notifications$'
- assertNotVisible: '^Mark all as read$'
- swipe:
    direction: DOWN
- assertVisible:
    id: ScreenHeaderTitle
    text: '^Workspaces$'
