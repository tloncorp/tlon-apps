appId: ${MAESTRO_APP_ID}
name: Cross-ship reaction add, count and selective removal
env:
  JOURNEY: reactions
---
- runScript: ../reliability/data.js
- runFlow: begin.yaml
- scrollUntilVisible:
    element: ${'React-' + MAESTRO_RUN_TAG}
    direction: DOWN
    timeout: 5000
- tapOn: ${'React-' + MAESTRO_RUN_TAG}
- extendedWaitUntil:
    visible: '^reaction target$'
    timeout: 15000
- longPressOn: '^reaction target$'
- tapOn:
    id: EmojiToolbarButton-thumb
- extendedWaitUntil:
    visible: '^two reactions verified$'
    timeout: 15000
- assertVisible:
    id: ReactionDisplay
    containsDescendants:
      - text: '^2$'
- tapOn:
    id: ReactionDisplay
- extendedWaitUntil:
    visible: '^reaction removal verified$'
    timeout: 15000
- assertVisible:
    id: ReactionDisplay
    containsDescendants:
      - text: '^1$'
- tapOn: '^Back$'
- assertVisible:
    id: ScreenHeaderTitle
    text: '^Home$'
