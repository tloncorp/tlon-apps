appId: ${MAESTRO_APP_ID}
name: Deny an incoming DM request
env:
  JOURNEY: dm-deny
---
- runScript: ../reliability/data.js
- runFlow: begin.yaml
- extendedWaitUntil:
    visible: '^160$'
    timeout: 15000
- tapOn: '^160$'
- assertVisible: ${MAESTRO_RUN_TAG + ' deny request'}
- assertVisible: '^Deny$'
- tapOn: '^Deny$'
- assertVisible:
    id: ScreenHeaderTitle
    text: '^Workspaces$'
- assertNotVisible: ${MAESTRO_RUN_TAG + ' deny request'}
- assertNotVisible: '^160$'
