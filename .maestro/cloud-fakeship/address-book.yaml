appId: ${MAESTRO_APP_ID}
name: A phone address book contact reaches the native contact list
env:
  JOURNEY: address-book
---
# Reads the real address book through expo-contacts, which unit tests mock.
- runScript: ../reliability/data.js
- runFlow: begin.yaml
- runFlow:
    file: subflows/seed-address-book-contact.yaml
    env:
      CONTACT_FIRST: ${'Book' + MAESTRO_RUN_TAG}
      CONTACT_LAST: Reader
      CONTACT_PHONE: '+16505550123'
# The app reads the address book at sync start, so relaunch it cold with access.
- launchApp:
    appId: ${MAESTRO_APP_ID}
    permissions:
      contacts: allow
- extendedWaitUntil:
    visible: '^(Tab Bar|Workspaces|Activity|Settings|Bot)$'
    timeout: 15000
- runFlow: ../reliability/subflows/contacts-screen.yaml
- scrollUntilVisible:
    element: ${'^Book' + MAESTRO_RUN_TAG + ' Reader$'}
    direction: DOWN
    timeout: 15000
