appId: ${MAESTRO_APP_ID}
name: Open group invitation and filter to a controlled ship
env:
  JOURNEY: member-invitation-filter
---
- runScript: ../reliability/data.js
- runFlow: begin.yaml
- scrollUntilVisible:
    element: ${'MemberInvite-' + MAESTRO_RUN_TAG}
    direction: DOWN
    timeout: 30000
- longPressOn: ${'MemberInvite-' + MAESTRO_RUN_TAG}
- tapOn: '^Group info & settings$'
- assertVisible: '^Group info & settings$'
- tapOn:
    id: GroupMembersInvitePeopleButton
- assertVisible:
    id: ScreenHeaderTitle
    text: '^Invite People$'
- tapOn: '^Filter by nickname, @p$'
- runFlow:
    file: ../reliability/subflows/input.yaml
    env:
      INPUT_TEXT: ~ten
- extendedWaitUntil:
    visible: '^(~ten|ten)$'
    timeout: 10000
- assertVisible: '^Contacts matching ‘~ten’$'
- tapOn:
    id: HeaderBackButton
- assertVisible: '^Group info & settings$'
- scrollUntilVisible:
    element:
      id: GroupLeaveAction-Delete group
    direction: DOWN
    timeout: 5000
- tapOn:
    id: GroupLeaveAction-Delete group
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: '^Delete group$'
          rightOf: '^Cancel$'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: '(?i)^Delete group$'
- extendedWaitUntil:
    visible:
      id: ScreenHeaderTitle
      text: '^Home$'
    timeout: 10000
- assertNotVisible: ${'MemberInvite-' + MAESTRO_RUN_TAG}
