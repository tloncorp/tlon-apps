appId: ${MAESTRO_APP_ID}
name: Host kicks member while member is in the channel
env:
  JOURNEY: moderation
---
- runScript: ../reliability/data.js
- runFlow: begin.yaml
- scrollUntilVisible:
    element: ${'Kick-' + MAESTRO_RUN_TAG}
    direction: DOWN
    timeout: 5000
- tapOn: ${'Kick-' + MAESTRO_RUN_TAG}
- extendedWaitUntil:
    visible: '^member before kick$'
    timeout: 15000
# Sending this marker lets the host remove the channel immediately.
- tapOn:
    id: MessageInput
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../reliability/subflows/input.yaml
    env:
      INPUT_TEXT: kick ready
- hideKeyboard
- tapOn:
    id: MessageInputSendButton
- extendedWaitUntil:
    notVisible:
      id: MessageInput
    timeout: 15000
- runFlow:
    when:
      notVisible:
        id: ScreenHeaderTitle
        text: '^Home$'
    commands:
      - pressKey: Back
- assertVisible: '^Home$'
- assertNotVisible: ${'Kick-' + MAESTRO_RUN_TAG}
