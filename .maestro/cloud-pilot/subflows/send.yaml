appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: MessageInput
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: MessageInput
    label: Composer stays visible with keyboard open
- runFlow:
    file: input.yaml
    env:
      INPUT_TEXT: ${MESSAGE}
- assertVisible:
    id: MessageInput
    text: ${MESSAGE}
- tapOn:
    id: MessageInputSendButton
- extendedWaitUntil:
    visible:
      id: MessageInput
      text: ${EMPTY_INPUT}
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: ChatMessageDeliveryStatus
    timeout: 5000
- assertNotVisible: '^Send failed, tap to retry$'
- assertVisible:
    id: '^Post$'
    containsDescendants:
      - text: ${MESSAGE_PATTERN}
- assertNotVisible:
    id: '^Post$'
    containsDescendants:
      - text: ${MESSAGE_PATTERN}
    index: 1
