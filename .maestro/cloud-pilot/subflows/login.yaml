appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: 'Have an account? Log in'
- runFlow:
    when:
      visible:
        id: 'log-in-with-email'
    commands:
      - tapOn:
          id: 'log-in-with-email'
- runFlow:
    when:
      visible: 'Log in with email'
    commands:
      - tapOn:
          text: .*Log in with email.*
          retryTapIfNoChange: true
- assertVisible:
    id: 'email-input'
- assertVisible:
    id: 'or-use-password'
- tapOn:
    id: 'or-use-password'

# Enter email
- assertVisible:
    id: 'email-input-legacy'
- tapOn:
    id: 'email-input-legacy'
- inputText:
    text: ${MAESTRO_EMAIL}
    label: Enter configured E2E account email

# Enter configured E2E account password
- tapOn:
    id: 'password-input-legacy'
- inputText:
    text: ${MAESTRO_PASSWORD}
    label: Enter configured E2E account password

- tapOn: 'Submit'

# Declared login/network phase; outside the 5-second warm interaction budget.
- extendedWaitUntil:
    visible: '^(Home|Nickname|Usage Statistics|Save Password\?)$'
    timeout: 60000
- runFlow:
    when:
      visible: '^Save Password\?$'
    commands:
      - tapOn: '^Not Now$'
# Revived test accounts retain their profile and notification preferences.
- extendedWaitUntil:
    visible: '^(Home|Nickname|Usage Statistics)$'
    timeout: 60000
- runFlow:
    when:
      visible: '^Nickname$'
    commands:
      - tapOn: '^Next$'
      - assertVisible: '^Notifications$'
      - tapOn: '^Next$'
      - runFlow:
          when:
            visible: 'On the next screen, make sure you tap'
          commands:
            - tapOn: '^Next$'
            - runFlow:
                when:
                  visible:
                    id: com.android.permissioncontroller:id/permission_allow_button
                commands:
                  - tapOn:
                      id: com.android.permissioncontroller:id/permission_allow_button
- extendedWaitUntil:
    visible: '^(Home|Usage Statistics)$'
    timeout: 60000
- runFlow:
    when:
      visible: '^Usage Statistics$'
    commands:
      - tapOn: '^Next$'
- extendedWaitUntil:
    visible: '^Home$'
    timeout: 60000
