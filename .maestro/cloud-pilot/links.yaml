appId: ${MAESTRO_APP_ID}
name: Native link preview removal and sending
tags: [regression]
env:
  JOURNEY: l
---
- runScript: data.js
- runFlow: subflows/begin.yaml
- runFlow: subflows/create-group.yaml
- tapOn: '^Chat$'
- tapOn:
    id: MessageInput
- inputText: https://example.com
- assertVisible:
    id: MessageInput
    text: '^https://example[.]com$'
- extendedWaitUntil:
    visible: '^Example Domain$'
    timeout: 5000
- assertVisible:
    id: MessageInputSendButton
- tapOn:
    id: MessageInput
    point: '95%,50%'
- eraseText: 100
- extendedWaitUntil:
    notVisible: '^Example Domain$'
    timeout: 5000
- assertVisible:
    id: MessageInput
    text: '^Message$'
- runFlow:
    file: subflows/send.yaml
    env:
      MESSAGE: ${output.reliability.text}
      MESSAGE_PATTERN: ${output.reliability.textPattern}
      EMPTY_INPUT: '^Message$'
- assertNotVisible: '^Example Domain$'
- tapOn:
    id: MessageInput
- inputText: ${MAESTRO_RUN_TAG + ' https://example.com'}
- assertVisible:
    id: MessageInput
    text: '^${MAESTRO_RUN_TAG} https://example[.]com$'
- extendedWaitUntil:
    visible: '^Example Domain$'
    timeout: 5000
- tapOn:
    id: MessageInputSendButton
- extendedWaitUntil:
    visible:
      id: MessageInput
      text: '^Message$'
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: ChatMessageDeliveryStatus
    timeout: 5000
- assertNotVisible: '^Send failed, tap to retry$'
- assertVisible:
    id: '^Post$'
    containsDescendants:
      - text: '^Example Domain$'
      - text: '.*${MAESTRO_RUN_TAG}.*'
- hideKeyboard
- tapOn: '^Back$'
- tapOn: '^Chat$'
- assertVisible: '^Example Domain$'
- assertVisible: ${output.reliability.textPattern}
- tapOn: '^Back$'
- tapOn: '^Back$'
- assertVisible: '^Home$'
