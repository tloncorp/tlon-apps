appId: ${MAESTRO_APP_ID}
name: Maestro ship settings actions and notebook
---
- runFlow: subflows/login.yaml
- runFlow: subflows/contacts-tab.yaml
- copyTextFrom:
    text: '^~[a-z]+(?:-[a-z]+)*$'
    leftOf: '^You$'
- evalScript: ${output.cloudShip = maestro.copiedText}
- runFlow: subflows/home-tab.yaml
- runFlow:
    file: settings.yaml
    env:
      MAESTRO_SESSION: warm
      MAESTRO_TEST_SHIP: ${output.cloudShip}
- runFlow:
    file: message-actions.yaml
    env:
      MAESTRO_SESSION: warm
      MAESTRO_TEST_SHIP: ${output.cloudShip}
- runFlow:
    file: notebook.yaml
    env:
      MAESTRO_SESSION: warm
      MAESTRO_TEST_SHIP: ${output.cloudShip}
