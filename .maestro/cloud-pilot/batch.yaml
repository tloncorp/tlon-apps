appId: ${MAESTRO_APP_ID}
name: Group-name keyboard on Android 33
---
- runFlow: subflows/login.yaml
- tapOn: '^Add a chat$'
- tapOn: '^New group$'
- tapOn: '^Basic group.*$'
- assertVisible: '^Name your group$'
- tapOn: '^Group name$'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    text: '^Name your group$'
    label: Group editor stays visible with keyboard open
- inputText: Probe33
- assertVisible: '^Probe33$'
- hideKeyboard
- assertVisible: '^Probe33$'
- tapOn: '^Next$'
- assertVisible: '^Select contacts to invite$'
