# Note, this test is currently disabled. It's been replaced by a playwright test.
appId: io.tlon.groups
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/tlon-login.yaml
- assertVisible: 'Workspaces'
# Tap on the "+" button
- tapOn:
    id: 'CreateGroupButton'
# Assert that the sheet pops
- assertVisible: 'Create a customizable workspace'
- tapOn: 'New empty workspace'
# Assert that the contacts sheet pops
- assertVisible: 'Select contacts to invite'
# Create the group
- tapOn: 'Create workspace'
- runFlow:
    when:
      visible: 'Untitled workspace'
    commands:
      - assertVisible: 'Welcome to your workspace!'
# Navigate back to the Workspaces list and assert that the group is created
- tapOn:
    id: 'HeaderBackButton'
- runFlow:
    when:
      visible: 'Workspaces'
    commands:
      - assertVisible: 'Untitled workspace'
      - tapOn: 'Untitled workspace'
      - assertVisible: 'Untitled workspace'
# Open the overflow menu from the channel header and delete the group
- tapOn:
    id: 'ChannelHeaderOverflowMenuButton'
- assertVisible: 'Secret workspace with 1 member'
- tapOn: 'Workspace info & settings'
- assertVisible: 'Workspace info'
- scrollUntilVisible:
    direction: DOWN
    element:
      text: 'Delete workspace'
- tapOn: 'Delete workspace'
- runFlow:
    when:
      visible: 'This action cannot be undone.'
    commands:
      - assertVisible: 'This action cannot be undone.'
      - tapOn: 'Delete workspace'
- runFlow:
    when:
      visible: 'Workspaces'
    commands:
      - assertVisible: 'Workspaces'
      - assertNotVisible: 'Untitled workspace'
# Log out
- tapOn:
    id: 'AvatarNavIcon'
- tapOn:
    id: 'ContactsSettingsButton'
- tapOn: 'Log out'
- tapOn: 'Log out now'
