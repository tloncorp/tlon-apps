appId: ${MAESTRO_APP_ID}
name: Native profile editing and persistence
tags: [regression]
env:
  JOURNEY: p
onFlowComplete:
  - runFlow:
      when:
        true: ${output.reliability && typeof output.reliability.originalNickname !== 'undefined'}
      commands:
        - runFlow:
            when:
              notVisible:
                id: ProfileNicknameInput
            commands:
              - runFlow:
                  when:
                    notVisible:
                      id: ContactEditButton
                  commands:
                    - runFlow: subflows/contacts-screen.yaml
                    - tapOn: '^You$'
              - tapOn:
                  id: ContactEditButton
        - tapOn:
            id: ProfileNicknameInput
            point: '95%,50%'
        - eraseText: 100
        - runFlow:
            when:
              true: ${output.reliability.originalNickname !== ''}
            commands:
              - inputText: ${output.reliability.originalNickname}
        - assertVisible:
            id: ProfileNicknameInput
            text: ${output.reliability.originalNickname || MAESTRO_TEST_SHIP}
        - tapOn: '^Save$'
        - tapOn: '^Back$'
        - assertNotVisible: ${MAESTRO_RUN_TAG + ' profile'}
        - runFlow: subflows/workspaces-tab.yaml
---
- runScript: data.js
- runFlow: subflows/begin.yaml
- runFlow: subflows/contacts-screen.yaml
- tapOn: '^You$'
- tapOn:
    id: ContactEditButton
- copyTextFrom:
    id: ProfileNicknameInput
- evalScript: ${output.reliability.originalNickname = maestro.copiedText || ''}
- tapOn:
    id: ProfileNicknameInput
    point: '95%,50%'
- eraseText: 100
- inputText: ${MAESTRO_RUN_TAG + ' profile'}
- assertVisible:
    id: ProfileNicknameInput
    text: ${MAESTRO_RUN_TAG + ' profile'}
- tapOn: '^Save$'
- assertVisible: '^Profile$'
- assertVisible: ${MAESTRO_RUN_TAG + ' profile'}
- tapOn: '^Back$'
- assertVisible:
    text: ${MAESTRO_RUN_TAG + ' profile'}
    leftOf: '^You$'
- stopApp
- launchApp
# The app restores the position it was closed in, so Contacts comes back
# directly rather than the chat list. Its header is up long before the rows
# are, which arrive with the contact data, so wait for the row itself.
- extendedWaitUntil:
    visible: '^Contacts$'
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: ${MAESTRO_RUN_TAG + ' profile'}
      leftOf: '^You$'
    timeout: 60000
- tapOn: '^You$'
- tapOn:
    id: ContactEditButton
- assertVisible:
    id: ProfileNicknameInput
    text: ${MAESTRO_RUN_TAG + ' profile'}
