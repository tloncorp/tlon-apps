appId: ${MAESTRO_APP_ID}
name: Native group and channel notification preferences
tags: [regression]
env:
  JOURNEY: volume
---
- runScript: data.js
- runFlow: subflows/begin.yaml
- runFlow: subflows/create-group.yaml
# Checks saved preferences and their independence, not delivery of push alerts.
- tapOn: ${output.reliability.groupPattern}
- tapOn: '^Notifications$'
- tapOn: '^Nothing$'
- tapOn: '^Back$'
- assertVisible:
    text: '(?s).*Nothing.*'
- tapOn: '^Back$'
- tapOn: '^Chat$'
- tapOn: '^Chat$'
- tapOn: '^Notifications$'
- tapOn: '^Mentions and replies$'
- tapOn: '^Back$'
- assertVisible:
    text: '(?s).*Mentions and replies.*'
- stopApp
- launchApp
- runFlow: subflows/open-fixture-group.yaml
- tapOn: ${output.reliability.groupPattern}
- assertVisible:
    text: '(?s).*Nothing.*'
- tapOn: '^Notifications$'
- tapOn: '^All (workspace )?activity$'
- tapOn: '^Back$'
- assertVisible:
    text: '(?s).*All activity.*'
- tapOn: '^Back$'
- tapOn: '^Chat$'
- tapOn: '^Chat$'
- assertVisible:
    text: '(?s).*Mentions and replies.*'
- tapOn: '^Notifications$'
- tapOn: '^Nothing$'
- tapOn: '^Back$'
- assertVisible:
    text: '(?s).*Nothing.*'
- tapOn: '^Back$'
- tapOn: '^Back$'
- tapOn: ${output.reliability.groupPattern}
- runFlow: subflows/delete-fixture-group.yaml
