appId: ${MAESTRO_APP_ID}
name: Native group and channel notification preferences
tags: [regression]
env:
  JOURNEY: volume
---
- runScript: data.js
- runFlow: subflows/begin.yaml
- runFlow: subflows/create-group.yaml
# Checks saved preferences and their independence, not delivery of push alerts.
- tapOn: ${output.reliability.groupPattern}
- tapOn: '^Notifications$'
- tapOn: '^Nothing$'
- tapOn: '^Back$'
- assertVisible:
    text: '(?s).*No notifications \(custom\).*'
- tapOn: '^Back$'
- tapOn: '^Chat$'
- tapOn: '^Chat$'
- tapOn: '^Notifications$'
- tapOn: '^Mentions and replies$'
- tapOn: '^Back$'
- assertVisible:
    text: '(?s).*Mentions and replies \(custom\).*'
- stopApp
- launchApp
- extendedWaitUntil:
    visible: '^Home$'
    timeout: 15000
- runFlow: subflows/open-fixture-group.yaml
- tapOn: ${output.reliability.groupPattern}
- assertVisible:
    text: '(?s).*No notifications \(custom\).*'
- tapOn: '^Notifications$'
- tapOn: '^All (group )?activity$'
- tapOn: '^Back$'
- assertVisible:
    text: '(?s).*All posts and replies \(custom\).*'
- tapOn: '^Back$'
- tapOn: '^Chat$'
- tapOn: '^Chat$'
- assertVisible:
    text: '(?s).*Mentions and replies \(custom\).*'
- tapOn: '^Notifications$'
- tapOn: '^Nothing$'
- tapOn: '^Back$'
- assertVisible:
    text: '(?s).*No notifications \(custom\).*'
- tapOn: '^Back$'
- tapOn: '^Back$'
- tapOn: ${output.reliability.groupPattern}
- runFlow: subflows/delete-fixture-group.yaml
