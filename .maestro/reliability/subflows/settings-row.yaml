appId: ${MAESTRO_APP_ID}
---
# Taps a row in Settings, wherever it has ended up. Two things move these rows:
# a hosted account with an agent renders the bot's own sections above the App
# section, pushing every row below the fold, and returning from a detail screen
# keeps whatever scroll position the previous row needed. So a single-direction
# scroll cannot reach every row. Scrolling up first is allowed to fail -- that
# only means the row is further down, which the second scroll then finds.
- scrollUntilVisible:
    element:
      text: ${ROW}
    direction: UP
    timeout: 5000
    optional: true
- scrollUntilVisible:
    element:
      text: ${ROW}
    direction: DOWN
    timeout: 10000
- tapOn: ${ROW}
