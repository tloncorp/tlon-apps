appId: ${MAESTRO_APP_ID}
---
- launchApp
# No landing gate here. Both callers are on the Profile screen when this runs
# -- the success path has just tapped `You`, and the completion hook can be
# anywhere a failure left it -- and the relaunch restores that route, so a
# wait naming a tab root only burns its timeout and leaves the temporary
# colour applied. `contacts-screen.yaml` unwinds whatever came back.
- runFlow: contacts-screen.yaml
- tapOn: '^You$'
- tapOn:
    id: ContactEditButton
- scrollUntilVisible:
    element:
      text: '^Default avatar color$'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: ${output.profileColor.targetId}
- assertVisible:
    id: ProfileAvatarPreview
    text: ${output.profileColor.originalLabel}
- tapOn: '^Save$'
- assertVisible:
    id: ProfileAvatar
    text: ${output.profileColor.originalLabel}
- evalScript: ${output.profileColor.changed = false}
