appId: ${MAESTRO_APP_ID}
---
- runFlow:
    when:
      true: ${output.reliability.session === 'fresh'}
    file: login.yaml
- runFlow:
    when:
      true: ${output.reliability.session === 'warm'}
    commands:
      # Reset keyboard state while preserving the login. The app restores the
      # position it was last closed in, so a warm run resumes wherever the
      # previous journey left off -- including on a screen pushed above the
      # tabs, which hides the tab bar. Unwind to a tab root before starting.
      - launchApp
      - runFlow: to-tab-root.yaml
# The app is past its splash and on a tab. Which tab varies -- a hosted account
# with an agent opens on the Bot tab, whose header title is blank -- so accept
# the iOS tab-bar container or, on Android, any tab label.
- extendedWaitUntil:
    visible: '^(Tab Bar|Workspaces|Activity|Settings|Bot)$'
    timeout: 5000
# Confirm the ship before anything writes to it. Settings reaches the user's
# own profile in one step, and the profile is where the ship name is shown.
- runFlow: settings-tab.yaml
- tapOn:
    id: SettingsProfileRow
- assertVisible: ${output.reliability.shipPattern}
- tapOn:
    id: HeaderBackButton
- runFlow: workspaces-tab.yaml
