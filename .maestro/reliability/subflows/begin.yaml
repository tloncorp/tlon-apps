appId: ${MAESTRO_APP_ID}
---
- runFlow:
    when:
      true: ${output.reliability.session === 'fresh'}
    file: login.yaml
- runFlow:
    when:
      true: ${output.reliability.session === 'warm'}
    commands:
      - launchApp:
          stopApp: false
      # A preceding failed journey may have left a sheet or editor open.
      # Recover the starting screen once; never retry that failed journey.
      - runFlow:
          when:
            notVisible: '^(Home|Contacts)$'
          commands:
            - launchApp
- extendedWaitUntil:
    visible: '^(Home|Contacts)$'
    timeout: 5000
- runFlow: contacts-tab.yaml
- tapOn: '^You$'
- assertVisible: ${output.reliability.shipPattern}
- tapOn: '^Back$'
- runFlow: home-tab.yaml
