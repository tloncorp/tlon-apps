appId: ${MAESTRO_APP_ID}
---
# The group-template path, used wherever the sheet still offers a bare group:
# an account without an agent, and every tablet or desktop window. Starts with
# the create sheet already open.
- tapOn: '^New group$'
- tapOn: '^Basic group.*$'
- tapOn: '^Group name$'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    text: '^Name your group$'
    label: Group editor stays visible with keyboard open
- runFlow:
    file: input.yaml
    env:
      INPUT_TEXT: ${output.reliability.group}
- assertVisible:
    text: ${output.reliability.groupPattern}
    below: '^Name your group$'
    above: '^Next$'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: '^Next$'
- assertVisible: '^Select contacts to invite$'
- tapOn: '^Create group$'
- extendedWaitUntil:
    visible: ${output.reliability.groupPattern}
    timeout: 15000
