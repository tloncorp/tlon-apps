appId: ${MAESTRO_APP_ID}
---
# Renames a channel from the group's channel list, and returns to it.
- tapOn: ${CHANNEL_FROM}
- tapOn: ${CHANNEL_FROM}
- tapOn: '^(Rename|Edit)$'
- tapOn:
    id: ChannelTitleInput
    point: '95%,50%'
- eraseText: 40
- inputText: ${CHANNEL_TO}
- assertVisible:
    id: ChannelTitleInput
    text: ${CHANNEL_TO}
- tapOn: '^Save$'
- extendedWaitUntil:
    visible: ${CHANNEL_TO}
    timeout: 15000
- tapOn: '^Back$'
