appId: ${MAESTRO_APP_ID}
---
# The Workspace path, used on a phone whose account has an agent: #6585 drops
# the bare group action there, so this is the only way left to create a group.
#
# A Workspace is not shaped like the template group the journeys expect. It is
# furnished over the network by the bot, arrives titled "My agent group" with a
# single chat channel called "General", and gains a notes channel called
# "Updates" only when it is the account's first. So the fixture is built the
# rest of the way here: renamed, its chat channel renamed, and the missing
# channels created, until it matches what create-group-plain.yaml produces.
#
# Starts with the create sheet already open.
- tapOn: '^New Workspace$'
# Furnishing is a round trip to the bot, and the quick start opens the new
# group's chat as soon as it exists rather than waiting for the rest.
- extendedWaitUntil:
    visible: '^General$'
    timeout: 120000
# Rename the group from inside its own chat rather than by finding it on the
# list. Cloud parallelizes the journeys against one shared account, and every
# one of them creates a workspace under the same "My agent group" title, so
# picking it by that name could take another journey's group. The channel the
# quick start opened belongs to this one, and its options sheet reaches the
# group directly. Renaming also settles the title before the bot renames it
# itself, which it does only while the title is the one it was created under.
- tapOn: '^General$'
- tapOn:
    id: GroupOptionsGroupInfoButton
- tapOn: '^Rename$'
- tapOn:
    id: GroupTitleInput
    point: '95%,50%'
- eraseText: 40
- inputText: ${output.reliability.group}
- assertVisible:
    id: GroupTitleInput
    text: ${output.reliability.groupPattern}
- tapOn: '^Save$'
- extendedWaitUntil:
    visible: ${output.reliability.groupPattern}
    timeout: 15000
# Back out to the chat list and re-enter by the fixture's own name, which is
# unique to this run, to reach the group's channel list.
- runFlow: workspaces-tab.yaml
- tapOn: ${output.reliability.groupPattern}
- extendedWaitUntil:
    visible: '^Edit channels$'
    timeout: 30000
- runFlow:
    file: rename-channel.yaml
    env:
      CHANNEL_FROM: '^General$'
      CHANNEL_TO: Chat
- runFlow:
    file: create-channel.yaml
    env:
      CHANNEL_TITLE: Gallery
      CHANNEL_TYPE_SUBTITLE: '^Gather and arrange rich media$'
# "Updates" is only there when this was the account's first Workspace, so the
# notebook is renamed when it exists and created when it does not.
- runFlow:
    when:
      visible: '^Updates$'
    commands:
      - runFlow:
          file: rename-channel.yaml
          env:
            CHANNEL_FROM: '^Updates$'
            CHANNEL_TO: Notebook
- runFlow:
    when:
      notVisible: '^Notebook$'
    commands:
      - runFlow:
          file: create-channel.yaml
          env:
            CHANNEL_TITLE: Notebook
            CHANNEL_TYPE_SUBTITLE: '^Collaborative markdown notebooks$'
- extendedWaitUntil:
    visible: ${output.reliability.groupPattern}
    timeout: 15000
