appId: ${MAESTRO_APP_ID}
---
# KNOWN GAP: this stops at "New group" on a phone whose account has an agent.
# The create sheet drops the bare group action there -- a Workspace is what the
# flow is for on mobile now -- and a Workspace is not shaped like this template
# group: it arrives titled "My agent group" with one chat channel called
# "General", gains a notes channel called "Updates" only when it is the
# account's first, and never gets a Gallery. Rebuilding the fixture from one is
# its own piece of work, tracked in TLON-6632; see the reliability README.
- assertNotVisible: ${output.reliability.groupPattern}
- tapOn: '^Add a chat$'
- tapOn: '^New group$'
- tapOn: '^Basic group.*$'
- tapOn: '^Group name$'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    text: '^Name your group$'
    label: Group editor stays visible with keyboard open
- runFlow:
    file: input.yaml
    env:
      INPUT_TEXT: ${output.reliability.group}
- assertVisible:
    text: ${output.reliability.groupPattern}
    below: '^Name your group$'
    above: '^Next$'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: '^Next$'
- assertVisible: '^Select contacts to invite$'
- tapOn: '^Create group$'
- extendedWaitUntil:
    visible: ${output.reliability.groupPattern}
    timeout: 15000
- assertVisible: '^Chat$'
- assertVisible: '^Gallery$'
- assertVisible: '^Notebook$'
