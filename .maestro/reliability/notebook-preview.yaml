appId: ${MAESTRO_APP_ID}
name: Native Notebook Markdown preview and empty state
tags: [regression]
env:
  JOURNEY: notebookpreview
---
- runScript: data.js
- runFlow: subflows/begin.yaml
- runFlow: subflows/create-group.yaml
- tapOn: '^Edit channels$'
- assertVisible: '^Channels$'
- tapOn: '^New( channel or section)?$'
- tapOn: '^New channel$'
- assertVisible: '^Create a new channel$'
- tapOn: '^Collaborative markdown notebooks$'
- tapOn:
    id: ChannelTitleInput
- runFlow:
    file: subflows/input.yaml
    env:
      INPUT_TEXT: ${output.reliability.channel}
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
      - scroll
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: '^Create channel$'
- extendedWaitUntil:
    visible: ${output.reliability.channel}
    timeout: 15000
- tapOn: '^Back$'
- tapOn: ${output.reliability.channel}
- extendedWaitUntil:
    visible: '^No notes or folders$'
    timeout: 15000

# An empty note has a specific preview state and stays editable.
- tapOn: '^New$'
- tapOn:
    id: NotesNewNoteAction
- extendedWaitUntil:
    visible:
      id: NotesTitleInput
    timeout: 15000
- tapOn:
    id: NotesTitleInput
- runFlow:
    file: subflows/input.yaml
    env:
      INPUT_TEXT: ${output.reliability.notePreviewTitle}
- tapOn:
    id: NotesPreviewToggle
- assertVisible:
    id: NotesPreviewPane
- assertVisible: '^Nothing to preview yet\.$'
- tapOn:
    id: NotesPreviewToggle
- assertVisible:
    id: NotesBodyInput

# A malformed Markdown edge is contained in the preview instead of crashing.
- tapOn:
    id: NotesBodyInput
- setClipboard: ${output.reliability.markdownMalformed}
- pasteText
- tapOn:
    id: NotesPreviewToggle
- assertVisible:
    id: NotesPreviewPane
- assertVisible: ${output.reliability.markdownMalformedRendered}
- tapOn:
    id: NotesPreviewToggle
- tapOn:
    id: NotesBodyInput
- eraseText: 1000

# Every construct in this deterministic body must render as content rather
# than source, and the example link must open its exact host.
# Pasting on Android drops the line breaks, so the body goes in a line at a
# time there.
- runFlow:
    when:
      platform: iOS
    commands:
      - setClipboard: ${output.reliability.markdownBody}
      - pasteText
- runFlow:
    when:
      platform: Android
    commands:
      - evalScript: ${output.bodyLine = 0}
      - repeat:
          times: ${output.reliability.markdownBody.split('\n').length}
          commands:
            - runFlow:
                when:
                  true: ${output.bodyLine > 0}
                commands:
                  - pressKey: Enter
                  # Typed straight after Enter, the next line can land out of
                  # order.
                  - waitForAnimationToEnd
            - runFlow:
                when:
                  true: ${output.reliability.markdownBody.split('\n')[output.bodyLine] !== ''}
                commands:
                  - inputText: ${output.reliability.markdownBody.split('\n')[output.bodyLine]}
            - evalScript: ${output.bodyLine += 1}
- assertVisible:
    id: NotesBodyInput
- tapOn:
    id: NotesPreviewToggle
- extendedWaitUntil:
    visible: '^Synced$'
    timeout: 15000
- assertVisible:
    id: NotesPreviewContent
- assertVisible: '^Rendered heading$'
- assertVisible: '^Bold sample and italic sample$'
- assertVisible: '^First item$'
- assertVisible: '^Second item$'
- assertVisible: '^inline code$'
- assertVisible: '^Example link$'
- assertNotVisible: '^# Rendered heading$'
- tapOn:
    text: '^Example link$'
    # The accessibility row spans the full preview width although the linked
    # glyphs are left-aligned. Tap the linked text, not the row's blank center.
    point: '10%,50%'
- extendedWaitUntil:
    # Safari prefixes the address value with an invisible direction marker.
    visible: '.*tlon\.io.*'
    timeout: 15000
- launchApp:
    appId: ${MAESTRO_APP_ID}
    stopApp: false
- extendedWaitUntil:
    visible:
      id: NotesPreviewToggle
    timeout: 15000
- assertVisible: '^Edit$'
- tapOn:
    id: NotesPreviewToggle
- tapOn:
    id: NotesBodyInput
- copyTextFrom:
    id: NotesBodyInput
- assertTrue: ${maestro.copiedText === output.reliability.markdownBody}
- inputText: X
- copyTextFrom:
    id: NotesBodyInput
- assertTrue: ${maestro.copiedText.includes('X')}

# Delete only this run's fixture group.
# While the keyboard is up, Android's own Back control answers to the same
# label as the header's.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: '^Back$'
- tapOn: '^Back$'
- assertVisible: ${output.reliability.groupPattern}
- tapOn: ${output.reliability.groupPattern}
- runFlow: subflows/delete-fixture-group.yaml
