appId: ${MAESTRO_APP_ID}
name: Native role create, edit, discard and delete
tags: [regression]
env:
  JOURNEY: roles
---
- runScript: data.js
- runFlow: subflows/begin.yaml
- runFlow: subflows/create-group.yaml
- tapOn: ${output.reliability.groupPattern}
- tapOn: '^Roles$'
- assertVisible: '^Group Roles$'
- assertVisible: '^Members$'
- tapOn: '^Admin$'
- assertNotVisible: '^Delete role$'
- assertVisible:
    id: RoleTitleInput
    text: '^Admin$'
- tapOn: '^Back$'
- assertVisible: '^Group Roles$'
- tapOn: '^New$'
- assertVisible: '^Add role$'
- tapOn:
    id: RoleTitleInput
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: subflows/input.yaml
    env:
      INPUT_TEXT: ${MAESTRO_RUN_TAG + ' role'}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: RoleDescriptionInput
    direction: DOWN
    timeout: 5000
- tapOn:
    id: RoleDescriptionInput
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: subflows/input.yaml
    env:
      INPUT_TEXT: ${MAESTRO_RUN_TAG + ' role description'}
- hideKeyboard
- tapOn: '^Save$'
- assertVisible: '^Group Roles$'
- assertVisible:
    id: ${'GroupRole-' + MAESTRO_RUN_TAG + ' role'}
- tapOn:
    id: ${'GroupRole-' + MAESTRO_RUN_TAG + ' role'}
- assertVisible:
    id: RoleDescriptionInput
    text: ${MAESTRO_RUN_TAG + ' role description'}
- tapOn:
    id: RoleTitleInput
    point: '95%,50%'
- eraseText: 100
- runFlow:
    file: subflows/input.yaml
    env:
      INPUT_TEXT: ${MAESTRO_RUN_TAG + ' renamed role'}
- hideKeyboard
- tapOn: '^Save$'
- assertVisible: '^Group Roles$'
- assertVisible:
    id: ${'GroupRole-' + MAESTRO_RUN_TAG + ' renamed role'}
- assertNotVisible:
    id: ${'GroupRole-' + MAESTRO_RUN_TAG + ' role'}
- stopApp
- launchApp
- extendedWaitUntil:
    visible: '^Home$'
    timeout: 15000
- runFlow: subflows/open-fixture-group.yaml
- tapOn: ${output.reliability.groupPattern}
- tapOn: '^Roles$'
- tapOn:
    id: ${'GroupRole-' + MAESTRO_RUN_TAG + ' renamed role'}
- assertVisible:
    id: RoleDescriptionInput
    text: ${MAESTRO_RUN_TAG + ' role description'}
- tapOn:
    id: RoleDescriptionInput
    point: '95%,50%'
- eraseText: 100
- runFlow:
    file: subflows/input.yaml
    env:
      INPUT_TEXT: discarded-description
- hideKeyboard
- tapOn: '^Back$'
- assertVisible: '^Discard changes[?]$'
- tapOn: '^Cancel$'
- assertVisible:
    id: RoleDescriptionInput
    text: '^discarded-description$'
- tapOn: '^Back$'
- tapOn: '^Discard$'
- assertVisible: '^Group Roles$'
- tapOn:
    id: ${'GroupRole-' + MAESTRO_RUN_TAG + ' renamed role'}
- assertVisible:
    id: RoleDescriptionInput
    text: ${MAESTRO_RUN_TAG + ' role description'}
- tapOn: '^Delete role$'
- assertVisible: '^Group Roles$'
- assertNotVisible:
    id: ${'GroupRole-' + MAESTRO_RUN_TAG + ' renamed role'}
- assertVisible: '^Admin$'
- assertVisible: '^Members$'
- tapOn: '^Back$'
- runFlow: subflows/delete-fixture-group.yaml
