appId: ${MAESTRO_APP_ID}
name: Native channel section create, rename and delete
tags: [regression]
env:
  JOURNEY: sections
---
- runScript: data.js
- runFlow: subflows/begin.yaml
- runFlow: subflows/create-group.yaml
- tapOn: '^Edit channels$'
- tapOn: '^New$'
- tapOn: '^New section$'
- assertVisible: '^Add section$'
- tapOn:
    id: SectionNameInput
- runFlow:
    file: subflows/input.yaml
    env:
      INPUT_TEXT: ${MAESTRO_RUN_TAG + ' section'}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: '^Save$'
- assertVisible: ${MAESTRO_RUN_TAG + ' section'}
- tapOn:
    id: SectionMenuButton
    rightOf: ${MAESTRO_RUN_TAG + ' section'}
- tapOn: '^Edit name$'
- assertVisible:
    id: SectionNameInput
    text: ${MAESTRO_RUN_TAG + ' section'}
- tapOn:
    id: SectionNameInput
    point: '95%,50%'
- eraseText: 100
- runFlow:
    file: subflows/input.yaml
    env:
      INPUT_TEXT: ${MAESTRO_RUN_TAG + ' renamed section'}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: '^Save$'
- assertVisible: ${MAESTRO_RUN_TAG + ' renamed section'}
- assertNotVisible: ${MAESTRO_RUN_TAG + ' section'}
- stopApp
- launchApp
- extendedWaitUntil:
    visible: '^Home$'
    timeout: 15000
- runFlow: subflows/open-fixture-group.yaml
- tapOn: '^Edit channels$'
- assertVisible: ${MAESTRO_RUN_TAG + ' renamed section'}
- tapOn:
    id: SectionMenuButton
    rightOf: ${MAESTRO_RUN_TAG + ' renamed section'}
- tapOn: '^Delete section$'
- assertNotVisible: ${MAESTRO_RUN_TAG + ' renamed section'}
- assertVisible: '^Chat$'
- assertVisible: '^Gallery$'
- assertVisible: '^Notebook$'
- tapOn: '^Back$'
- runFlow:
    when:
      visible:
        id: ScreenHeaderTitle
        text: '^Home$'
    commands:
      - tapOn: ${output.reliability.groupPattern}
- tapOn: ${output.reliability.groupPattern}
- runFlow: subflows/delete-fixture-group.yaml
