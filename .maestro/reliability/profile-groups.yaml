appId: ${MAESTRO_APP_ID}
name: Native profile pinned group persistence and removal
tags: [regression]
env:
  JOURNEY: pg
onFlowComplete:
  - runFlow:
      when:
        true: ${output.profileGroupAdded === true}
      commands:
        - launchApp
        - runFlow: subflows/contacts-screen.yaml
        - tapOn: '^You$'
        - tapOn:
            id: ContactEditButton
        - scrollUntilVisible:
            element:
              text: ${output.reliability.groupPattern}
            direction: DOWN
            timeout: 5000
        - tapOn:
            id: ProfilePinnedGroupRemove
            rightOf: ${output.reliability.groupPattern}
        - tapOn: '^Save$'
---
- runScript: data.js
- runFlow: subflows/begin.yaml
- runFlow: subflows/create-group.yaml
- tapOn: ${output.reliability.groupPattern}
- assertVisible: '^Workspace info & settings$'
# Secret groups cannot be displayed on a profile. Only change our own fixture.
- tapOn:
    id: GroupPrivacy
- tapOn: '^Private$'
- tapOn: '^Back$'
- assertVisible: '^Private$'
- tapOn: '^Back$'
- tapOn: '^Back$'
- runFlow: subflows/contacts-screen.yaml
- tapOn: '^You$'
- tapOn:
    id: ContactEditButton
- scrollUntilVisible:
    element:
      text: '^Add a workspace$'
    direction: DOWN
    timeout: 5000
- assertNotVisible: ${output.reliability.groupPattern}
- tapOn: '^Add a workspace$'
- assertNotVisible: '^No more workspaces can be selected.*$'
- scrollUntilVisible:
    element:
      text: ${output.reliability.groupPattern}
    direction: DOWN
    timeout: 5000
- tapOn: ${output.reliability.groupPattern}
- evalScript: ${output.profileGroupAdded = true}
- tapOn:
    id: CloseFavoriteGroupSelectorSheet
- assertVisible: ${output.reliability.groupPattern}
- tapOn: '^Save$'
- assertVisible: ${output.reliability.groupPattern}
- stopApp
- launchApp
- runFlow: subflows/contacts-screen.yaml
- tapOn: '^You$'
- assertVisible: ${output.reliability.groupPattern}
- tapOn:
    id: ContactEditButton
- scrollUntilVisible:
    element:
      text: ${output.reliability.groupPattern}
    direction: DOWN
    timeout: 5000
- tapOn:
    id: ProfilePinnedGroupRemove
    rightOf: ${output.reliability.groupPattern}
- assertNotVisible: ${output.reliability.groupPattern}
- tapOn: '^Save$'
- evalScript: ${output.profileGroupAdded = false}
- assertNotVisible: ${output.reliability.groupPattern}
- stopApp
- launchApp
- runFlow: subflows/contacts-screen.yaml
- tapOn: '^You$'
- assertNotVisible: ${output.reliability.groupPattern}
- tapOn: '^Back$'
- runFlow: subflows/workspaces-tab.yaml
- tapOn: '^Search$'
# Keep the query distinct from the result's accessible name.
- inputText: ${output.reliability.groupQuery}
- hideKeyboard
- tapOn: ${output.reliability.groupPattern}
- tapOn: ${output.reliability.groupPattern}
- assertVisible: '^Workspace info & settings$'
- scrollUntilVisible:
    element:
      id: GroupLeaveAction-Delete workspace
    direction: DOWN
    timeout: 5000
- tapOn:
    id: GroupLeaveAction-Delete workspace
- assertVisible: '^Delete ${output.reliability.group}[?]$'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: '^Delete workspace$'
          rightOf: '^Cancel$'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: '(?i)^Delete workspace$'
- assertVisible: '^Workspaces$'
- assertNotVisible: ${output.reliability.groupPattern}
- tapOn: '^Clear$'
- tapOn: '^Close$'
