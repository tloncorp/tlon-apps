- assertVisible: '^Join a workspace$'
- assertVisible: '^Join a workspace with a code \(reference\)$'
- assertVisible: '^Enter workspace code$'
- assertVisible: '^Close$'
- tapOn: '^Close$'
- assertVisible:
    id: ScreenHeaderTitle
    text: '^Workspaces$'
