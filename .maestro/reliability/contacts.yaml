appId: ${MAESTRO_APP_ID}
name: Native contact add, nickname, and removal
tags: [regression]
env:
  JOURNEY: k
onFlowComplete:
  - runFlow:
      when:
        true: ${output.reliability && output.contactAdded}
      commands:
        - launchApp
        - runFlow: subflows/contacts-screen.yaml
        - runFlow:
            when:
              visible: ${output.reliability.contactNickname}
            commands:
              - tapOn: ${output.reliability.contactNickname}
        - runFlow:
            when:
              notVisible: '^Remove Contact$'
            commands:
              - runFlow:
                  when:
                    visible: ${MAESTRO_CONTACT_SHIP}
                  commands:
                    - tapOn: ${MAESTRO_CONTACT_SHIP}
        - runFlow:
            when:
              visible: '^Remove Contact$'
            commands:
              - tapOn: '^Remove Contact$'
              - evalScript: ${output.contactAdded = false}
              - assertVisible: '^Add Contact$'
---
# Use an explicit disposable contact fixture; it need not run a UI or reply.
- assertTrue: ${typeof MAESTRO_CONTACT_SHIP !== 'undefined' && MAESTRO_CONTACT_SHIP !== MAESTRO_TEST_SHIP}
- runScript: data.js
- runFlow: subflows/begin.yaml
- runFlow: subflows/contacts-screen.yaml
- tapOn: '^Add contacts$'
- tapOn: '^Filter by nickname, @p$'
- inputText: ${MAESTRO_CONTACT_SHIP}
- hideKeyboard
- tapOn:
    id: ContactRow
    point: '90%,50%'
    containsDescendants:
      - text: ${MAESTRO_CONTACT_SHIP}
- tapOn: '^Add 1 contact$'
- evalScript: ${output.contactAdded = true}
- tapOn: ${MAESTRO_CONTACT_SHIP}
- assertVisible: '^Remove Contact$'
- tapOn:
    id: ContactEditButton
- tapOn:
    id: ProfileNicknameInput
- eraseText: 100
- inputText: ${output.reliability.contactNickname}
- tapOn: '^Save$'
- assertVisible: ${output.reliability.contactNickname}
- stopApp
- launchApp
- runFlow: subflows/contacts-screen.yaml
- tapOn: ${output.reliability.contactNickname}
- assertVisible: ${MAESTRO_CONTACT_SHIP}
- tapOn: '^Remove Contact$'
- evalScript: ${output.contactAdded = false}
- assertVisible: '^Add Contact$'
- assertNotVisible: ${output.reliability.contactNickname}

# Add the foreign ship directly from its profile and verify the Contacts return.
- tapOn: '^Add Contact$'
- assertVisible: '^Remove Contact$'
- evalScript: ${output.contactAdded = true}
- tapOn: '^Back$'
- assertVisible: ${MAESTRO_CONTACT_SHIP}

# Restore the disposable fixture so repeated runs remain independent.
- tapOn: ${MAESTRO_CONTACT_SHIP}
- tapOn: '^Remove Contact$'
- evalScript: ${output.contactAdded = false}
- assertVisible: '^Add Contact$'
- tapOn: '^Back$'
- assertNotVisible: ${MAESTRO_CONTACT_SHIP}
- runFlow: subflows/workspaces-tab.yaml
