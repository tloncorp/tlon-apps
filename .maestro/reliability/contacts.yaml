appId: ${MAESTRO_APP_ID}
name: Native contact nickname and removal
tags: [regression]
env:
  JOURNEY: k
onFlowComplete:
  - runFlow:
      when:
        true: ${output.reliability && output.contactAdded}
      commands:
        - launchApp
        - extendedWaitUntil:
            visible: '^Home$'
            timeout: 15000
        - runFlow: subflows/contacts-tab.yaml
        - runFlow:
            when:
              visible: ${MAESTRO_RUN_TAG + ' contact'}
            commands:
              - tapOn: ${MAESTRO_RUN_TAG + ' contact'}
        - runFlow:
            when:
              notVisible: '^Remove Contact$'
            commands:
              - tapOn: ${MAESTRO_CONTACT_SHIP}
        - tapOn: '^Remove Contact$'
        - assertVisible: '^Add Contact$'
---
# Use an explicit disposable contact fixture; it need not run a UI or reply.
- assertTrue: ${typeof MAESTRO_CONTACT_SHIP !== 'undefined' && MAESTRO_CONTACT_SHIP !== MAESTRO_TEST_SHIP}
- runScript: data.js
- runFlow: subflows/begin.yaml
- runFlow: subflows/contacts-tab.yaml
- tapOn: '^Add contacts$'
- tapOn: '^Filter by nickname, @p$'
- inputText: ${MAESTRO_CONTACT_SHIP}
- hideKeyboard
- tapOn:
    id: ContactRow
    point: '90%,50%'
    containsDescendants:
      - text: ${MAESTRO_CONTACT_SHIP}
- tapOn: '^Add 1 contact$'
- evalScript: ${output.contactAdded = true}
- tapOn: ${MAESTRO_CONTACT_SHIP}
- assertVisible: '^Remove Contact$'
- tapOn:
    id: ContactEditButton
- tapOn:
    id: ProfileNicknameInput
- eraseText: 100
- inputText: ${MAESTRO_RUN_TAG + ' contact'}
- tapOn: '^Save$'
- assertVisible: ${MAESTRO_RUN_TAG + ' contact'}
- stopApp
- launchApp
- runFlow: subflows/contacts-tab.yaml
- tapOn: ${MAESTRO_RUN_TAG + ' contact'}
- assertVisible: ${MAESTRO_CONTACT_SHIP}
- tapOn: '^Remove Contact$'
- assertVisible: '^Add Contact$'
- evalScript: ${output.contactAdded = false}
- assertNotVisible: ${MAESTRO_RUN_TAG + ' contact'}
- tapOn: '^Back$'
- assertNotVisible: ${MAESTRO_RUN_TAG + ' contact'}
- runFlow: subflows/home-tab.yaml
