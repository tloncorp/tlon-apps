appId: ${MAESTRO_APP_ID}
name: Native self-hosted login rejects invalid credentials and recovers
tags: [regression, onboarding]
env:
  JOURNEY: selfhosted
---
- runScript: data.js
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible: '^Tlon Messenger$'
- tapOn: '^Have an account\? Log in$'
- tapOn: '^Or configure self hosted$'
- assertVisible: '^Connect Ship$'

# Reject a malformed URL locally and leave the form available for correction.
- tapOn:
    id: '^textInput shipUrl$'
- inputText: not-a-url
- tapOn:
    id: '^textInput accessCode$'
- assertVisible: '^Please enter a valid URL\.$'
- assertVisible: '^Connect Ship$'
- assertNotVisible: '^Home$'

# A well-formed but incorrect code must reach the ship and fail authentication.
- tapOn:
    id: '^textInput shipUrl$'
- eraseText: 100
- inputText:
    text: ${MAESTRO_LOGIN_URL}
    label: Enter configured test ship URL
- tapOn:
    id: '^textInput accessCode$'
- inputText: aaaaaa-aaaaaa-aaaaaa-aaaaaa
- tapOn: '^Connect$'
- extendedWaitUntil:
    visible: '^Authentication failed with status 400\. The access code was rejected\.$'
    timeout: 15000
- assertVisible: '^Connect Ship$'
- assertVisible:
    id: '^textInput shipUrl$'
- assertVisible:
    id: '^textInput accessCode$'
- assertNotVisible: '^Home$'

# Correct only the code, then prove the same form reaches the configured ship.
- tapOn:
    id: '^textInput accessCode$'
- eraseText: 100
- inputText:
    text: ${MAESTRO_LOGIN_CODE}
    label: Enter configured test ship access code
- tapOn: '^Connect$'
- extendedWaitUntil:
    visible: '^(Home|Usage Statistics|Save Password\?)$'
    timeout: 60000
- runFlow:
    when:
      visible: '^Save Password\?$'
    commands:
      - tapOn: '^Not Now$'
- extendedWaitUntil:
    visible: '^(Home|Usage Statistics)$'
    timeout: 60000
- runFlow:
    when:
      visible: '^Usage Statistics$'
    commands:
      - tapOn: '^Next$'
- extendedWaitUntil:
    visible: '^Home$'
    timeout: 60000
- runFlow: subflows/contacts-tab.yaml
- tapOn: '^You$'
- assertVisible: ${output.reliability.shipPattern}
- tapOn: '^Back$'
- runFlow: subflows/home-tab.yaml
