appId: ${MAESTRO_APP_ID}
name: Native pin dismissal, replacement and persistence
tags: [regression]
env:
  JOURNEY: p
---
- runScript: data.js
- runFlow: subflows/begin.yaml
- runFlow: subflows/create-group.yaml
- tapOn: '^Chat$'
- runFlow:
    file: subflows/send.yaml
    env:
      MESSAGE: ${output.reliability.text}
      MESSAGE_PATTERN: ${output.reliability.textPattern}
      EMPTY_INPUT: '^Message$'
- hideKeyboard
- longPressOn: ${output.reliability.textPattern}
- scrollUntilVisible:
    element:
      text: '^Pin post to channel$'
    direction: DOWN
    timeout: 5000
- tapOn: '^Pin post to channel$'
- assertVisible: "${'.+: ' + output.reliability.text}"
- tapOn: '^Dismiss pinned post$'
- assertVisible: '^Chat$'
- assertVisible:
    id: MessageInput
- assertNotVisible: "${'.+: ' + output.reliability.text}"
- runFlow:
    file: subflows/send.yaml
    env:
      MESSAGE: ${output.reliability.reply}
      MESSAGE_PATTERN: ${output.reliability.replyPattern}
      EMPTY_INPUT: '^Message$'
- hideKeyboard
- longPressOn: ${output.reliability.replyPattern}
- scrollUntilVisible:
    element:
      text: '^Pin post to channel$'
    direction: DOWN
    timeout: 5000
- tapOn: '^Pin post to channel$'
- assertVisible: "${'.+: ' + output.reliability.reply}"
- assertNotVisible: "${'.+: ' + output.reliability.text}"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: '^Home$'
    timeout: 15000
- runFlow: subflows/home-tab.yaml
- tapOn: ${output.reliability.groupPattern}
- tapOn: '^Chat$'
- assertVisible: "${'.+: ' + output.reliability.reply}"
- assertNotVisible: "${'.+: ' + output.reliability.text}"
- tapOn: '^Dismiss pinned post$'
- assertNotVisible: "${'.+: ' + output.reliability.reply}"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: '^Home$'
    timeout: 15000
- runFlow: subflows/home-tab.yaml
- tapOn: ${output.reliability.groupPattern}
- tapOn: '^Chat$'
- assertNotVisible: "${'.+: ' + output.reliability.reply}"
# Dismissing the banner must leave the post pinned.
- longPressOn: ${output.reliability.replyPattern}
- scrollUntilVisible:
    element:
      text: '^Unpin post$'
    direction: DOWN
    timeout: 5000
- tapOn: '^Unpin post$'
- assertNotVisible: "${'.+: ' + output.reliability.reply}"
