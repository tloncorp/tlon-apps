appId: ${MAESTRO_APP_ID}
name: Native group privacy persistence
tags: [regression]
env:
  JOURNEY: privacy
---
- runScript: data.js
- runFlow: subflows/begin.yaml
- runFlow: subflows/create-group.yaml
- tapOn: ${output.reliability.groupPattern}
- tapOn: '^Privacy$'
- assertVisible: '^Workspace privacy$'
- tapOn: '^Private$'
- tapOn: '^Back$'
- assertVisible: '^Private workspace with 1 member$'
- stopApp
- launchApp
- runFlow: subflows/open-fixture-group.yaml
- tapOn: ${output.reliability.groupPattern}
- assertVisible: '^Private workspace with 1 member$'
- tapOn: '^Privacy$'
- tapOn: '^Public$'
- tapOn: '^Back$'
- assertVisible: '^Public workspace with 1 member$'
- tapOn: '^Privacy$'
- tapOn: '^Secret$'
- tapOn: '^Back$'
- assertVisible: '^Secret workspace with 1 member$'
- stopApp
- launchApp
- runFlow: subflows/open-fixture-group.yaml
- tapOn: ${output.reliability.groupPattern}
- assertVisible: '^Secret workspace with 1 member$'
- runFlow: subflows/delete-fixture-group.yaml
