id: group-news-bot
who: Runs a small group and wants the bot to post news there.
wants: The bot posting curated news from a few named websites into their group on a schedule.
expectPlan: 'yes'
opening: can I have you join a group of mine to post news stories from specific websites
knows:
- The sites are The Verge and Ars Technica for tech news, and ScienceDaily for science.
- Wants one post each morning.
- Has already added the bot to their group Tech Friends; the news should go in its General chat.
style: Practical, medium-length messages.
patience: 3
afterEnding: can other people in the group ask you things too?
group:
  title: Tech Friends
  channel: General
