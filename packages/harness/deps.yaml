  rev: eae4a12117347a72a3d9159032e800da20bffcb9  # develop on 2026-11-05
  export: desk
  files:
    # types the hand and the tlon tool import
    - sur/activity-ver.hoon
    - sur/buckets.hoon
    - sur/channels-ver.hoon
    - sur/channels.hoon
    - sur/chat-ver.hoon
    - sur/contacts.hoon
    - sur/groups-ver.hoon
    - sur/groups.hoon
    - sur/hooks.hoon
    - sur/notes.hoon
    - sur/presence.hoon
    - sur/reel.hoon
    - sur/steward.hoon
    - sur/steward/gateway.hoon
    - sur/steward/lens.hoon
    - sur/story.hoon
    # JSON codecs
    - lib/channel-json.hoon
    - lib/groups-json.hoon
    - lib/logs.hoon
    - lib/story-json.hoon
    # what the files above import
    - lib/cite-json.hoon
    - lib/mop-extensions.hoon
    - sur/activity.hoon
    - sur/chat-2.hoon
    - sur/chat-3.hoon
    - sur/chat-4.hoon
    - sur/chat-5.hoon
    - sur/chat-6.hoon
    - sur/chat-7.hoon
    - sur/chat.hoon
    - sur/cite.hoon
    - sur/epic.hoon
    - sur/logs.hoon
    - sur/meta.hoon
    - sur/ui.hoon
