# Files the desk imports but does not own, pinned by commit.
#
# `just fetch` copies each listed file into desk-deps/, with `export` stripped
# from its path. `rev` must be a full commit hash: a single commit is fetched
# shallowly, and the hash is also the integrity check.

# %base development libraries and marks. 408k-2, the newest kelvin listed in
# desk/sys.kelvin.
base:
  url: https://github.com/urbit/urbit.git
  rev: 5a187fededc4582a34fcd6055c67bb63e0917b94
  export: pkg/base-dev
  files:
    # agents, threads and tests
    - lib/dbug.hoon
    - lib/default-agent.hoon
    - lib/skeleton.hoon
    - lib/strand.hoon
    - lib/test.hoon
    - sur/spider.hoon
    # WASM stack for the QuickJS %code tool (lib/thread-builder-js)
    - lib/wasm/lia.hoon
    - lib/wasm/parser.hoon
    - lib/wasm/runner/engine.hoon
    - lib/wasm/runner/op-def.hoon
    - lib/wasm/validator.hoon
    - sur/wasm/engine.hoon
    - sur/wasm/lia.hoon
    - sur/wasm/wasm.hoon
    # one mark per file type in the desk
    - mar/bill.hoon
    - mar/hoon.hoon
    - mar/kelvin.hoon
    - mar/wasm.hoon
    # marks the ones above delegate revision control to
    - mar/mime.hoon
    - mar/noun.hoon
    - mar/txt.hoon
    # JSON pokes and scries through Eyre; error traces
    - mar/json.hoon
    - mar/tang.hoon

# Tlon protocol types and JSON codecs. The Tlon hand talks to the ship's own
# Groups agents through their versioned marks; these are the types behind
# those marks. No agent, mark or interface is taken from this desk.
tlon:
