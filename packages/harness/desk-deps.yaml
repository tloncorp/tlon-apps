# Files the desk imports but does not own.
#
# `just fetch` copies each listed file into desk-deps/, with `export` stripped
# from its path. A git source is pinned by `rev`, which must be a full commit
# hash: a single commit is fetched shallowly, and the hash is also the
# integrity check. A file:// source is a directory, relative to this file,
# whose files are copied as they are.

# %base development libraries and marks. Pinned to the commit of the 408k-2
# tag, separately from the %groups pin in the repository's desk-deps.yaml so
# each desk moves its pin on its own.
base:
  url: https://github.com/urbit/urbit.git
  rev: 5a187fededc4582a34fcd6055c67bb63e0917b94
  export: pkg/base-dev
  files:
    # agents, threads and tests
    - lib/dbug.hoon
    - lib/default-agent.hoon
    - lib/skeleton.hoon
    - lib/strand.hoon
    - lib/test.hoon
    - sur/spider.hoon
    # WASM stack for the QuickJS %code tool (lib/thread-builder-js)
    - lib/wasm/lia.hoon
    - lib/wasm/parser.hoon
    - lib/wasm/runner/engine.hoon
    - lib/wasm/runner/op-def.hoon
    - lib/wasm/validator.hoon
    - sur/wasm/engine.hoon
    - sur/wasm/lia.hoon
    - sur/wasm/wasm.hoon
    # one mark per file type in the desk
    - mar/bill.hoon
    - mar/hoon.hoon
    - mar/kelvin.hoon
    - mar/wasm.hoon
    # marks the ones above delegate revision control to
    - mar/mime.hoon
    - mar/noun.hoon
    - mar/txt.hoon
    # JSON pokes and scries through Eyre; error traces
    - mar/json.hoon
    - mar/tang.hoon

# Tlon protocol types and JSON codecs, from this repository's own checkout so
# they always match the %groups desk next to them. The Tlon hand talks to the
# ship's own Groups agents through their versioned marks; these are the types
# behind those marks. No agent, mark or interface is taken from that desk.
tlon:
  url: file://../..
  export: desk
  files:
    # types the hand and the tlon tool import
    - sur/activity-ver.hoon
    - sur/buckets.hoon
    - sur/channels-ver.hoon
    - sur/channels.hoon
    - sur/chat-ver.hoon
    - sur/contacts.hoon
    - sur/groups-ver.hoon
    - sur/groups.hoon
    - sur/hooks.hoon
    - sur/notes.hoon
    - sur/presence.hoon
    - sur/reel.hoon
    - sur/steward.hoon
    - sur/steward/gateway.hoon
    - sur/steward/lens.hoon
    - sur/story.hoon
    # JSON codecs
    - lib/channel-json.hoon
    - lib/groups-json.hoon
    - lib/logs.hoon
    - lib/story-json.hoon
    # what the files above import
    - lib/cite-json.hoon
    - lib/mop-extensions.hoon
    - sur/activity.hoon
    - sur/chat-2.hoon
    - sur/chat-3.hoon
    - sur/chat-4.hoon
    - sur/chat-5.hoon
    - sur/chat-6.hoon
    - sur/chat-7.hoon
    - sur/chat.hoon
    - sur/cite.hoon
    - sur/epic.hoon
    - sur/logs.hoon
    - sur/meta.hoon
    - sur/ui.hoon
