// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '37.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '28')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '37')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '36')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '2.2.0'

        ndkVersion = "27.2.12479018"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.google.gms:google-services:4.4.2')
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
        classpath('com.google.firebase:firebase-crashlytics-gradle:3.0.8')
        classpath('io.sentry:sentry-android-gradle-plugin:6.21.0')
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

subprojects {
  configurations.all {
    it.resolutionStrategy.activateDependencyLocking()

    // @sentry/react-native 8.34.0 and older bundle sentry-native <= 0.17.4, whose
    // crash handler aborts on an uncaught std::bad_alloc while unwinding and
    // replaces the original native crash with its own SIGABRT (TLON-7013,
    // getsentry/sentry-native#2235). sentry-java 8.63.0 brings sentry-native
    // 0.17.6 with the fix. The whole sentry-java set moves together because
    // sentry-native-ndk 0.17 removed an API that sentry-android-ndk 8.57.0 calls.
    // Remove once @sentry/react-native bundles sentry-java >= 8.63.0.
    it.resolutionStrategy.eachDependency { details ->
      if (details.requested.group == 'io.sentry' && details.requested.name != 'sentry-native-ndk') {
        details.useVersion('8.63.0')
        details.because('TLON-7013: sentry-native 0.17.5+ crash handler fix')
      }
    }
  }
}

dependencyLocking {
  lockAllConfigurations()
}
