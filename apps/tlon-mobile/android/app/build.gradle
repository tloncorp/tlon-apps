apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

// monorepo root; contains `packages/`, `apps/`, etc
def workspaceRoot = "$projectRoot/../.."

// Add tasks to bundle and copy `packages/scripts/` so that it can be accessed by
// `TalkMessagingService` at runtime.
afterEvaluate {
    def buildTask = tasks.create(
            name: "buildNotificationServiceJsBundle",
            type: Exec
    ) {
        description = "Bundle JS for TalkMessagingService"
        workingDir workspaceRoot
        def pnpmExe = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "pnpm.cmd" : "pnpm"
        commandLine pnpmExe, "run", "--filter", "scripts", "build"
    }
    def copyTask = tasks.create(
            name: "copyNotificationServiceJsBundle",
            type: Copy
    ) {
        description = "Copy JS assets for TalkMessagingService into app bundle"
        into "$projectDir/src/main/assets"
        from("$workspaceRoot/packages/scripts/build") {
            include("*.js")
            rename '(.*).js', '$1.jsbundle'
        }
    }

    copyTask.dependsOn(buildTask)

    tasks.matching { it.name.startsWith("preBuild") }.all { preBuildTask ->
        preBuildTask.dependsOn(copyTask)
    }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = ["previewDebug", "previewDebugOptimized", "productionDebug", "productionDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

def hasSentryAuthToken = System.getenv("SENTRY_AUTH_TOKEN")
def hasSentryProperties = file("$rootDir/sentry.properties").exists() || file("$projectDir/sentry.properties").exists()
if (hasSentryAuthToken || hasSentryProperties) {
    apply from: new File(["node", "--print", "require.resolve('@sentry/react-native/package.json')"].execute().text.trim(), "../sentry.gradle")

    // `sentry.gradle` above only uploads the JS source map. Native (NDK) frames stay
    // unsymbolicated without the Sentry Android Gradle Plugin, which is what uploads
    // the unstripped .so debug info — so a Fabric SIGSEGV shows one exported symbol
    // and `?` for every other frame.
    //
    // Applied inside the same gate as the source map upload: SAGP has no per-variant
    // switch (the `sentry {}` extension is project-wide), so gating the `apply` is the
    // gate. Scoping to release is left to the plugin, which only registers upload
    // tasks for non-debuggable variants.
    apply plugin: "io.sentry.android.gradle"

    sentry {
        // `shouldSentryAutoUpload()` comes from sentry.gradle and honours
        // SENTRY_DISABLE_AUTO_UPLOAD / SENTRY_DISABLE_NATIVE_DEBUG_UPLOAD, so native
        // symbols obey the same escape hatches as the source map upload. Org, project
        // and token are deliberately not set here: sentry-cli then reads the same
        // SENTRY_* environment / sentry.properties the source map upload uses.
        uploadNativeSymbols = shouldSentryAutoUpload()
        autoUploadNativeSymbols = shouldSentryAutoUpload()
        includeNativeSources = true

        // @sentry/react-native already brings io.sentry:sentry-android (pinned in
        // app/gradle.lockfile). Auto-installation would add the plugin's own version
        // on top and break the lock.
        autoInstallation {
            enabled = false
        }
        // Bytecode instrumentation is a tracing feature we don't use; leaving it on
        // would rewrite classes at build time for no benefit.
        tracingInstrumentation {
            enabled = false
        }
        // On by default, which would report build metrics to Sentry from every
        // credentialed CI build; nobody asked for that.
        telemetry = false
        // R8 mapping handling stays exactly as it is today — sentry.gradle uploads no
        // mapping, and turning that on is a separate change from native symbols.
        includeProguardMapping = false
        autoUploadProguardMapping = false
    }
} else {
    logger.lifecycle("Skipping Sentry source map and native symbol upload (no SENTRY_AUTH_TOKEN or sentry.properties found)")
}
android {
    ndkVersion rootProject.ext.ndkVersion

    namespace "io.tlon.landscape"
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        compileSdk rootProject.ext.compileSdkVersion
        versionCode 108
        versionName "9.5.2"

        // Read by RNFB as `rnfirebase_crashlytics_auto_collection_enabled`, ahead of
        // its own `BuildConfig.DEBUG` check. That check can't be trusted here: RNGP
        // generates a `debugOptimized` build type whose matchingFallbacks send every
        // dependency lacking it to `release`, so the Crashlytics library believes it
        // is in a production build while react-android — which does declare
        // `debugOptimized` — turns Metro dev support on. Default off so a new build
        // type never starts reporting into the production project by accident.
        manifestPlaceholders["crashlyticsAutoCollectionEnabled"] = "false"
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            manifestPlaceholders["crashlyticsAutoCollectionEnabled"] = "true"
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
            firebaseCrashlytics {
                // Symbolize native crash frames inside third-party .so files. With
                // unstrippedNativeLibsDir left unset the plugin reads AGP's
                // MERGED_NATIVE_LIBS artifact — every .so before stripping, from
                // autolinked CMake modules (libworklets.so, libreanimated.so) and
                // prebuilt AARs alike. Setting that property *replaces* the default
                // rather than adding to it, so don't.
                //
                // Nothing wires the upload into assemble/bundle, so a build has to ask
                // for :app:uploadCrashlyticsSymbolFile<Variant> by name — see the
                // Android gradleCommand entries in eas.json.
                nativeSymbolUploadEnabled true
            }
        }
        releaseDebuggable {
            // Like release but with debuggable=true for testing
            initWith release
            debuggable true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            // initWith copied release's `true`; this variant is never shipped.
            manifestPlaceholders["crashlyticsAutoCollectionEnabled"] = "false"
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    flavorDimensions "profile"
    productFlavors {
        production {
            dimension "profile"
            applicationId "io.tlon.groups"
        }
        preview {
            dimension "profile"
            applicationId "io.tlon.groups.preview"
        }
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
    implementation("androidx.security:security-crypto-ktx:1.1.0-alpha06")
    implementation("androidx.lifecycle:lifecycle-process:2.9.3")
    implementation("com.android.volley:volley:1.2.1")
    implementation "com.google.firebase:firebase-messaging:24.0.1"


    // Branch.io
    implementation("io.branch.sdk.android:library:5.9.0")
    implementation("com.google.android.gms:play-services-ads-identifier:18.0.1")
    implementation("androidx.browser:browser:1.7.0")

    // PostHog - pinned to avoid constructor signature incompatibilities with newer versions
    implementation("com.posthog:posthog-android:3.8.2")
    testImplementation("junit:junit:4.13.2")
}
