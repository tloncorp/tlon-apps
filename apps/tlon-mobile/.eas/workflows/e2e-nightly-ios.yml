name: e2e-nightly-mobile

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  build_ios_for_e2e:
    type: build
    environment: production
    params:
      platform: ios
      profile: e2e

  build_android_for_reliability:
    type: build
    environment: production
    params:
      platform: android
      profile: local-testing

  tests_started:
    needs: [build_ios_for_e2e]
    outputs:
      started_at_epoch_seconds:
        ${{ steps.capture_start.outputs.started_at_epoch_seconds }}
    steps:
      - id: capture_start
        name: Capture start time
        run: |
          set-output started_at_epoch_seconds "$(date +%s)"

  maestro_nightly:
    needs: [build_ios_for_e2e, tests_started]
    type: maestro-cloud
    environment: production
    params:
      build_id: ${{ needs.build_ios_for_e2e.outputs.build_id }}
      maestro_project_id: proj_01jjmcqhxneg69zpqdty84xqvt
      flows: "../../.maestro"
      name: nightly-develop-ios

  reliability_ios:
    after: [build_ios_for_e2e, maestro_nightly]
    if: ${{ after.build_ios_for_e2e.status == 'success' }}
    type: maestro-cloud
    environment: production
    env:
      MAESTRO_APP_ID: io.tlon.groups
      MAESTRO_EMAIL: ${{ env.MAESTRO_RELIABILITY_EMAIL }}
      MAESTRO_PASSWORD: ${{ env.MAESTRO_RELIABILITY_PASSWORD }}
      MAESTRO_TEST_SHIP: '~batbet-litnec'
      MAESTRO_RUN_TAG: nightly-${{ workflow.id }}-ios
    params:
      build_id: ${{ after.build_ios_for_e2e.outputs.build_id }}
      maestro_project_id: proj_01jjmcqhxneg69zpqdty84xqvt
      maestro_version: 2.6.1
      flows: '../../.maestro/reliability'
      device_model: iPhone-17
      device_os: iOS-26-2
      name: nightly-reliability-ios

  # Both platforms share the test ship. Run Android even if iOS tests failed,
  # but wait for iOS to finish so profile/settings changes cannot race.
  reliability_android:
    after: [build_android_for_reliability, reliability_ios]
    if: ${{ after.build_android_for_reliability.status == 'success' }}
    type: maestro-cloud
    environment: production
    env:
      MAESTRO_APP_ID: io.tlon.groups
      MAESTRO_EMAIL: ${{ env.MAESTRO_RELIABILITY_EMAIL }}
      MAESTRO_PASSWORD: ${{ env.MAESTRO_RELIABILITY_PASSWORD }}
      MAESTRO_TEST_SHIP: '~batbet-litnec'
      MAESTRO_RUN_TAG: nightly-${{ workflow.id }}-android
    params:
      build_id: ${{ after.build_android_for_reliability.outputs.build_id }}
      maestro_project_id: proj_01jjmcqhxneg69zpqdty84xqvt
      maestro_version: 2.6.1
      flows: '../../.maestro/reliability'
      device_model: pixel_6
      device_os: android-33
      name: nightly-reliability-android

  notify_webhook:
    name: Alert
    after: [build_ios_for_e2e, tests_started, maestro_nightly]
    if: ${{ always() }}
    env:
      BUILD_STATUS: ${{ after.build_ios_for_e2e.status }}
      MAESTRO_STATUS: ${{ after.maestro_nightly.status }}
      STARTED_AT_EPOCH_SECONDS:
        ${{ after.tests_started.outputs.started_at_epoch_seconds || '0' }}
      FAILED_FLOWS_COUNT:
        ${{ after.maestro_nightly.outputs.failed_flows_count || 0 }}
      SUCCESSFUL_FLOWS_COUNT:
        ${{ after.maestro_nightly.outputs.successful_flows_count || 0 }}
      TOTAL_FLOWS_COUNT:
        ${{ after.maestro_nightly.outputs.total_flows_count || 0 }}
      FAILED_FLOW_NAMES_JSON:
        ${{ after.maestro_nightly.outputs.failed_flow_names_json || '[]' }}
      MAESTRO_CLOUD_URL:
        ${{ after.maestro_nightly.outputs.maestro_cloud_url || workflow.url }}
    steps:
      - name: Send alert
        run: |
          PAYLOAD=$(node <<'NODE'
          const buildStatus = process.env.BUILD_STATUS || 'unknown';
          const maestroStatus = process.env.MAESTRO_STATUS || 'unknown';
          const startedAt = Number(process.env.STARTED_AT_EPOCH_SECONDS || '0');
          const failedFlows = JSON.parse(process.env.FAILED_FLOW_NAMES_JSON || '[]');
          const failedCount = process.env.FAILED_FLOWS_COUNT || '0';
          const successfulCount = process.env.SUCCESSFUL_FLOWS_COUNT || '0';
          const totalCount = process.env.TOTAL_FLOWS_COUNT || '0';
          const resultsUrl = process.env.MAESTRO_CLOUD_URL;
          const elapsedSeconds = startedAt > 0 ? Math.max(0, Math.round(Date.now() / 1000) - startedAt) : null;

          function formatDuration(totalSeconds) {
            if (totalSeconds === null) {
              return null;
            }

            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            if (hours > 0) {
              return `${hours}h ${minutes}m ${seconds}s`;
            }

            if (minutes > 0) {
              return `${minutes}m ${seconds}s`;
            }

            return `${seconds}s`;
          }

          const duration = formatDuration(elapsedSeconds);

          let summary;
          if (buildStatus !== 'success') {
            summary = `❌ Nightly iOS smoke build failed before tests ran${duration ? ` after ${duration}` : ''}`;
          } else if (maestroStatus !== 'success' && Number(totalCount) === 0) {
            summary = `❌ Nightly iOS smoke run failed before Maestro results were available${duration ? ` after ${duration}` : ''}`;
          } else if (Number(failedCount) > 0) {
            const failedNames = failedFlows.length ? ` (${failedFlows.join(', ')})` : '';
            summary = `❌ Nightly iOS smoke finished with failures: ${successfulCount}/${totalCount} passed, ${failedCount} failed${duration ? ` in ${duration}` : ''}${failedNames}`;
          } else {
            summary = `✅ Nightly iOS smoke passed: ${successfulCount}/${totalCount} flows completed${duration ? ` in ${duration}` : ''}`;
          }

          process.stdout.write(
            JSON.stringify({
              apiKey: process.env.MAESTRO_ALERT_BOT_API_KEY,
              content: [
                {
                  inline: [
                    summary,
                    ' (',
                    {
                      link: {
                        href: resultsUrl,
                        content: 'results',
                      },
                    },
                    ')',
                  ],
                },
              ],
            }),
          );
          NODE
          )

          curl -X POST "${MAESTRO_SERVERLESS_INFRA_API}/sendAlertBotMessage" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
