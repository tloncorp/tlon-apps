name: Hermes Tlon Adapter CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/hermes-tlon-adapter/**"
      - "packages/tlon-bot-e2e/**"
      - "packages/tlon-skill/**"
      - "packages/api/**"
      - "desk/**"
      - "peru.yaml"
      - "scripts/assemble-desk.sh"
      - "scripts/sync-deps.sh"
      - "pnpm-lock.yaml"
      - ".github/workflows/hermes-ci.yml"

jobs:
  shared-e2e:
    name: Shared E2E
    runs-on: blacksmith-8vcpu-ubuntu-2204
    # Three runtimes boot fresh stacks and re-apply the branch %groups desk
    # (baseline and cron scenario partitions, then the package suite; ~8-9
    # minutes per apply on native runners when the desk has drifted). The
    # previous budgets were exceeded at exactly that arithmetic.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install peru
        run: pipx install --force peru

      # Only the clone cache is restored. `.peru/lastimports` is deliberately
      # left out: it records what peru already materialized, and a fresh
      # checkout has no desk-deps/, so restoring it could make `peru sync`
      # no-op and leave assemble-desk.sh failing on "desk-deps/ not found".
      - name: Cache peru clone cache
        uses: actions/cache@v4
        with:
          path: .peru/cache
          key: peru-cache-${{ hashFiles('peru.yaml') }}

      # Vendor desk deps here, not inside the E2E run. branch-desk.ts bounds
      # its assemble-desk.sh call to 300s to contain a hung fetch, but that
      # cap also covered `peru sync`, which clones ~900MB of upstream history
      # (urbit/urbit, landscape) on a cold cache — ~2 minutes at best. Slow
      # GitHub blew the cap and killed the job (exit 143) before a single
      # scenario ran. Hoisted here it answers to the job timeout instead.
      - name: Vendor desk dependencies
        run: ./scripts/sync-deps.sh

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - name: Cache fake ship archives
        uses: actions/cache@v4
        with:
          path: .cache/tlon-bot-e2e/fake-ships
          # Keyed on the compose file so a pier-generation bump rolls the
          # cache: Actions caches are immutable, and a stale exact-key hit
          # would leave every job re-downloading ~1GB of archives forever.
          key:
            tlon-bot-e2e-fake-ships-${{
            hashFiles('packages/tlon-bot-e2e/docker/docker-compose.base.yml') }}

      - name: Prepare fake ship cache
        run: mkdir -p .cache/tlon-bot-e2e/fake-ships

      - name: Typecheck shared E2E harness
        run: pnpm --filter '@tloncorp/tlon-bot-e2e' tsc

      - name: Run shared E2E unit tests
        run: pnpm --filter '@tloncorp/tlon-bot-e2e' test:unit

      - name: Run Hermes shared E2E
        env:
          # desk-deps/ is vendored in the step above; assemble-desk.sh must
          # not re-fetch inside branch-desk.ts's 300s cap.
          SKIP_SYNC: "true"
          FAKE_SHIP_CACHE_DIR:
            ${{ github.workspace }}/.cache/tlon-bot-e2e/fake-ships
          TLON_BOT_E2E_RUN_ID:
            ${{ github.run_id }}-${{ github.run_attempt }}-hermes
        run: pnpm --filter '@tloncorp/tlon-bot-e2e' test:e2e:hermes

      - name: Run Hermes cron partition E2E
        env:
          # desk-deps/ is vendored in the step above; assemble-desk.sh must
          # not re-fetch inside branch-desk.ts's 300s cap.
          SKIP_SYNC: "true"
          FAKE_SHIP_CACHE_DIR:
            ${{ github.workspace }}/.cache/tlon-bot-e2e/fake-ships
          TLON_BOT_E2E_RUN_ID:
            ${{ github.run_id }}-${{ github.run_attempt }}-hermes-cron
          TLON_BOT_E2E_SCENARIO_PARTITIONS: cron
        run: pnpm --filter '@tloncorp/tlon-bot-e2e' test:e2e:hermes

      - name: Run Hermes package smoke E2E
        env:
          # desk-deps/ is vendored in the step above; assemble-desk.sh must
          # not re-fetch inside branch-desk.ts's 300s cap.
          SKIP_SYNC: "true"
          FAKE_SHIP_CACHE_DIR:
            ${{ github.workspace }}/.cache/tlon-bot-e2e/fake-ships
          TLON_BOT_E2E_RUN_ID:
            ${{ github.run_id }}-${{ github.run_attempt }}-hermes-package
        run: pnpm --filter '@tloncorp/tlon-bot-e2e' test:e2e:hermes:package
