name: EAS agent with Blacksmith ships (experiment)
# Manual harness proof; self-hosted identity is checked before recording.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR receiving the harness report and embedded video
        required: true
        default: '6496'
        type: string
      eas_run_id:
        description: Publish an existing EAS run without rerunning ships or the simulator (optional)
        type: string
permissions:
  contents: read
concurrency:
  group: agent-ships-proof
  cancel-in-progress: false
jobs:
  proof:
    if: ${{ !inputs.eas_run_id }}
    outputs:
      eas_run_id: ${{ steps.qa.outputs.eas_run_id }}
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 55
    env:
      PROOF_OUTPUT: ${{ github.workspace }}/proof-output
      MAESTRO_RUN_TAG: ci${{ github.run_id }}a${{ github.run_attempt }}
      MAESTRO_APP_ID: io.tlon.groups
      MAESTRO_TEST_SHIP: '~zod'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore prepared ships
        id: snapshot
        uses: actions/cache/restore@v4
        with:
          path: .proof-snapshot
          key: rube-prepared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desk/**', '!desk/commit.txt', 'peru.yaml', 'apps/tlon-web/e2e/shipManifest.json') }}
      - name: Install ship and tunnel tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y netcat-openbsd tmux rsync
          command -v nginx
          java -version
          pipx install peru
          curl -fsSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar xz -C /tmp
          echo /tmp >> "$GITHUB_PATH"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter tlon-web rube:compile
      - name: Start matching ships and restricted tunnel
        id: ships
        env:
          NGROK_AUTHTOKEN: ${{ secrets.MAESTRO_FAKE_SHIP_NGROK_TOKEN }}
          QA_TUNNEL_TOKEN: ${{ secrets.QA_TUNNEL_TOKEN }}
        run: bash .maestro/cloud-fakeship/start.sh
      - name: Run the EAS iOS agent against these ships
        id: qa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          QA_SHIP_URL: ${{ steps.ships.outputs.url }}
        run: node scripts/agent-qa/dispatch-ships.mjs
      - name: Verify peer evidence
        run: test -f "$PROOF_OUTPUT/peer-result.json" && cat "$PROOF_OUTPUT/peer-result.json"
      - name: Snapshot validated backend after clean shutdown
        id: capture
        if: always() && steps.ships.outcome == 'success' && steps.snapshot.outputs.cache-hit != 'true'
        run: bash .maestro/cloud-fakeship/snapshot.sh
      - name: Save prepared ships
        if: always() && steps.capture.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .proof-snapshot
          key: ${{ steps.snapshot.outputs.cache-primary-key }}
      - name: Stop experiment processes
        if: always()
        run: |
          tmux kill-session -t proof-rube 2>/dev/null || true
          for name in ngrok peer; do
            file="$PROOF_OUTPUT/$name.pid"
            if [ -f "$file" ]; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done
          nginx -s stop -c "$RUNNER_TEMP/proof-nginx.conf" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-ships-proof
          path: proof-output/
          retention-days: 3
  publish:
    needs: proof
    if: ${{ always() && !cancelled() && (inputs.eas_run_id || needs.proof.outputs.eas_run_id) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QA_EAS_RUN_ID: ${{ inputs.eas_run_id || needs.proof.outputs.eas_run_id }}
      QA_PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Fetch the saved QA report and recording from EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/agent-qa/publish.mjs prepare
      - name: Install GitHub CLI with native attachment support
        run: |
          curl --fail --location --retry 2 https://github.com/cli/cli/releases/download/v2.99.0/gh_2.99.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/gh.tar.gz"
          echo "ed4960225d2833e04a61590d9fa2b5773d147f3aa375459e5466a40c102f3832  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
      - name: Embed the recording in the PR and verify the video player
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          QA_GH_BIN: ${{ runner.temp }}/gh_2.99.0_linux_amd64/bin/gh
        run: node scripts/agent-qa/publish.mjs publish
