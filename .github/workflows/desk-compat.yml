# Desk N-1 compatibility for a release candidate.
#
# ci.yml is `pull_request`-only, so nothing there runs on a release branch — and
# its `changes` job has no checkout (PR filtering goes through the API), which
# is why a paths-filter is not an option here: dorny/paths-filter needs a
# working tree on push. So this runs unconditionally for the whole candidate.
#
# It is a reusable workflow rather than a `push` observer on purpose: the
# workflows that promote a candidate (deploy-canary.yml and deploy-livenet.yml
# deploy it, sync-dev.yml merges staging into develop) call it as a job their
# promotion steps `need`, so a blocking verdict stops the promotion instead of
# failing beside it.
#
# Each caller passes `ref` as the ref it actually deploys — the staging tip, or
# the dispatched tag — because under `workflow_call` the run's own `github.sha`
# is the *caller's* commit, which on a tag dispatch is not the tree being
# shipped. `workflow_dispatch` stays for running the report by hand, where an
# empty `ref` means the ref you dispatched from.
#
# Policy: docs/tlon-apps/desk-compatibility.md
name: Desk N-1 Compatibility
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
        description: The ref to check; defaults to the caller's commit.
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: false
        default: ""
        description: The ref to check; empty means the ref you dispatched from.
jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    name: Check the release candidate against desk N-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      # A default checkout is depth 1 with no tags, so neither the N-1 desk tag
      # nor origin/master is present. Fetch them narrowly.
      - name: Fetch the refs the check compares
        run: |
          set -euo pipefail
          # The commit that was checked out, which is what the caller is
          # promoting. Not $GITHUB_SHA: under workflow_call that is the
          # caller's ref, and on a tag dispatch the two differ.
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          MIN=$(node -p "require('fs').readFileSync('packages/shared/src/logic/deskPolicy.ts','utf8').match(/MIN_GROUPS_VERSION = '([^']+)'/)[1]")
          echo "MIN_GROUPS_VERSION=$MIN" >> "$GITHUB_ENV"
          # Both refspecs are literal, so they resolve the same whether HEAD is
          # a branch tip or a tag.
          git fetch --no-tags --depth=1 origin "refs/tags/v${MIN}:refs/tags/v${MIN}"
          git fetch --no-tags --depth=1 origin refs/heads/master:refs/remotes/origin/master

      # Rule (b): the candidate must not need anything N-1 lacks. The report
      # goes to the job summary whatever the verdict, because GUARDED,
      # WILDCARD and UNVERIFIED entries are the release reviewer's worklist.
      #
      # `--base-ref origin/master` is what stops a candidate carrying both a
      # new unsupported request and the known-gaps entry excusing it: an entry
      # only applies to a request the released client already made and this
      # desk already could not take.
      - name: Candidate client vs desk N-1
        id: candidate_client_vs_desk_n_1
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "## Candidate client vs desk N-1 (v$MIN_GROUPS_VERSION)"
            pnpm check:desk-compat --desk-ref "v$MIN_GROUPS_VERSION" \
              --base-ref origin/master --markdown
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Candidate self-consistency: a client change needing a desk change
      # nobody made. Both refs are the same SHA and spelled the same way, so
      # the checker reads it as the self-comparison it is — a tree cannot
      # differ from itself, and every `protocolBumps` entry would otherwise be
      # reported stale. `--base-ref` is what lets it still see a removal this
      # release makes, which its own desk alone cannot show.
      - name: Candidate client vs candidate desk
        id: candidate_client_vs_candidate_desk
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "## Candidate client vs candidate desk"
            pnpm check:desk-compat --client-ref "$CANDIDATE_SHA" \
              --desk-ref "$CANDIDATE_SHA" --base-ref origin/master --markdown
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Rule (c): a desk change that removed something the released client
      # still uses. No `--base-ref` here either: `origin/master` is already the
      # client under test, so it is its own base and the comparison would be
      # with itself. origin/master is the last sync of `staging` after a
      # deployment workflow *ran* — sync.yml triggers on `types: [completed]`,
      # which fires whatever the conclusion, and merges the staging tip as it
      # stands at that moment. So it is the best standing proxy for the
      # released client, not proof of a deployed SHA.
      - name: Released client vs candidate desk
        id: released_client_vs_candidate_desk
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "## Released client vs candidate desk"
            pnpm check:desk-compat --client-ref origin/master --desk-ref "$CANDIDATE_SHA" --markdown
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Each comparison runs whatever the ones before it did — a release
      # reviewer needs all three reports, not just the first failure.
      - name: Verdict
        if: ${{ !cancelled() }}
        env:
          RESULTS: >-
            ${{ steps.candidate_client_vs_desk_n_1.outcome }}
            ${{ steps.candidate_client_vs_candidate_desk.outcome }}
            ${{ steps.released_client_vs_candidate_desk.outcome }}
        run: |
          set -euo pipefail
          echo "outcomes: $RESULTS"
          case "$RESULTS" in
            *failure*) echo "::error::a desk compatibility comparison failed; see the job summary"; exit 1 ;;
          esac
