name: Deploy Groups
on:
  workflow_run:
    # "Sync Develop with Staging" still fires for a manual dispatch of that
    # workflow; "Staging" is the run name it now completes under when called
    # from staging.yml, which is how the develop deploy is normally triggered.
    workflows: ["Sync Develop with Staging", "Staging"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: develop
        description: Enter the tag to deploy
  push:
    branches:
      - "develop"
env:
  tag: ${{ github.event.inputs.tag || 'develop' }}
concurrency:
  group: ${{ format('{0}-{1}', github.ref, 'deploy') }}
  cancel-in-progress: true
jobs:
  build-frontend:
    runs-on: ubuntu-latest
    name: "Build Frontend"
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          ref: ${{ env.tag }}
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version-file: .nvmrc
      - name: Setup PNPM
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]
      - name: Build packages
        run: pnpm build:all
      - working-directory: ./apps/tlon-web
        run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "ui-dist"
          path: apps/tlon-web/dist
    env:
      VITE_BROWSER_SERVICE_ENDPOINT: ${{ secrets.BROWSER_SERVICE_ENDPOINT }}
      VITE_BRANCH_DOMAIN_PROD: ${{ secrets.VITE_BRANCH_DOMAIN_PROD}}
      VITE_BRANCH_DOMAIN_TEST: ${{ secrets.VITE_BRANCH_DOMAIN_TEST}}
      VITE_BRANCH_KEY_PROD: ${{ secrets.VITE_BRANCH_KEY_PROD}}
      VITE_BRANCH_KEY_TEST: ${{ secrets.VITE_BRANCH_KEY_TEST}}
      VITE_INVITE_PROVIDER: ${{ secrets.VITE_INVITE_PROVIDER}}
      VITE_INVITE_SERVICE_ENDPOINT: ${{ secrets.VITE_INVITE_SERVICE_ENDPOINT}}
      VITE_POST_HOG_API_KEY: ${{ secrets.VITE_POST_HOG_API_KEY}}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: devstream
      VITE_GIT_HASH: ${{ github.sha }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_WEB_PROJECT: ${{ secrets.SENTRY_WEB_PROJECT }}
      CI: true
      NODE_OPTIONS: --max-old-space-size=6144
  glob:
    runs-on: ubuntu-latest
    name: "Make a glob"
    needs: build-frontend
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          ref: ${{ env.tag }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: "ui-dist"
          path: apps/tlon-web/dist
      - id: "auth"
        uses: "google-github-actions/auth@3a3c4c57d294ef65efaaee4ff17b22fa88dd3c69" # v1
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_KEY }}"
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@e30db14379863a8c79331b04a9969f4c1e225e0b" # v1
      - name: "glob"
        uses: ./.github/actions/glob
        with:
          folder: "apps/tlon-web/dist/*"
          docket: "desk/desk.docket-0"
      - name: Commit and Push Glob
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          git add desk/desk.docket-0
          git commit -n -m "update glob: ${{ steps.glob.outputs.hash }} [skip actions]" || echo "No changes to commit"
          INPUT=${{ env.tag }}
          BRANCH=${INPUT:-"develop"}
          git pull origin $BRANCH --rebase --autostash
          git push
  deploy:
    runs-on: ubuntu-latest
    needs: glob
    name: "Deploy a glob to ~wannec-dozzod-marnus (devstream)"
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          ref: ${{ env.tag }}
      - id: "auth"
        uses: "google-github-actions/auth@3a3c4c57d294ef65efaaee4ff17b22fa88dd3c69" # v1
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_KEY }}"
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@e30db14379863a8c79331b04a9969f4c1e225e0b" # v1
      - id: deploy
        name: Deploy
        run:
          ./.github/helpers/deploy.sh tloncorp/tlon-apps groups
          wannec-dozzod-marnus us-central1-a mainnet-tlon-other-2d ${{ env.tag
          }}
        env:
          SSH_SEC_KEY: ${{ secrets.GCP_SSH_SEC_KEY }}
          SSH_PUB_KEY: ${{ secrets.GCP_SSH_PUB_KEY }}
