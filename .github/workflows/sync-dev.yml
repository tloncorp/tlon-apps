name: Sync Develop with Staging
on:
  # Called by staging.yml after the canary deploy.
  workflow_call:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    name: "Syncs the latest staging deploy from staging to develop"
    steps:
      - uses: actions/checkout@v3
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Set Git config
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Github Actions"
      - name: Merge Staging to Develop
        run: |
          git fetch --unshallow
          git checkout staging
          git pull
          git checkout develop
          git pull
          # desk.docket-0 conflicts on every sync (each branch carries its own glob
          # hash); the step runs under bash -e, so the merge must not abort it before
          # the --theirs recovery below.
          git merge staging || true
          git checkout --theirs desk/desk.docket-0
          git add -A
          git diff-index --quiet HEAD || git commit -n --no-edit
          git push
