name: Sync Develop with Staging
on:
  # Called by staging.yml after the canary deploy.
  workflow_call:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    name: "Syncs the latest staging deploy from staging to develop"
    steps:
      - uses: actions/checkout@v3
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Set Git config
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Github Actions"
      - name: Merge Staging to Develop
        run: |
          git fetch --unshallow
          git checkout staging
          git pull
          git checkout develop
          git pull
          # desk.docket-0 conflicts on every sync (each branch carries its own glob
          # hash), so the merge must not abort the step (bash -e) before the
          # --theirs recovery below. Only the docket may conflict: anything else
          # is a real merge conflict that needs a human, so stop here rather than
          # commit conflict markers to develop.
          git merge staging || true
          unmerged=$(git diff --name-only --diff-filter=U)
          if [ -n "$unmerged" ] && [ "$unmerged" != "desk/desk.docket-0" ]; then
            echo "::error::staging→develop sync has conflicts outside desk/desk.docket-0; resolve by hand:"
            echo "$unmerged"
            exit 1
          fi
          if [ "$unmerged" = "desk/desk.docket-0" ]; then
            git checkout --theirs desk/desk.docket-0
          fi
          git add -A
          git diff-index --quiet HEAD || git commit -n --no-edit
          git push
