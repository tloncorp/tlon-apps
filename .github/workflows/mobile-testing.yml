name: Maestro concurrency pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test existing binary on the Maestro ship
        id: maestro
        uses: mobile-dev-inc/action-maestro-cloud@854f4005c1ef637d20b7007d428d23afe17c9665
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          project-id: proj_01jjmcqhxneg69zpqdty84xqvt
          app-binary-id: 3ec31be4a55a6372967a8da5339f89f156cabad9
          workspace: .maestro/cloud-pilot
          maestro-cli-version: 2.6.1
          name: concurrency-pilot-${{ github.run_id }}
          timeout: 15
          env: |
            MAESTRO_APP_ID=io.tlon.groups.preview
            MAESTRO_EMAIL=${{ secrets.MAESTRO_EMAIL }}
            MAESTRO_PASSWORD=${{ secrets.MAESTRO_PASSWORD }}
            MAESTRO_RUN_TAG=c${{ github.run_id }}a${{ github.run_attempt }}
      - name: Report cloud result
        if: always()
        env:
          CONSOLE_URL: ${{ steps.maestro.outputs.MAESTRO_CLOUD_CONSOLE_URL }}
          CLOUD_STATUS: ${{ steps.maestro.outputs.MAESTRO_CLOUD_UPLOAD_STATUS }}
        run: |
          printf 'Cloud status: %s\nResults: %s\n' "$CLOUD_STATUS" "$CONSOLE_URL" >> "$GITHUB_STEP_SUMMARY"
          test "$CLOUD_STATUS" = SUCCESS
