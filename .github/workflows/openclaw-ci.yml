name: OpenClaw Plugin CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/openclaw/**"
      - "packages/tlon-bot-e2e/**"
      - "packages/api/**"
      - "packages/tlon-skill/**"
      - "desk/**"
      - "peru.yaml"
      - "scripts/assemble-desk.sh"
      - "scripts/sync-deps.sh"
      - "pnpm-lock.yaml"
      - ".github/workflows/openclaw-ci.yml"

jobs:
  unit-test:
    name: Unit Tests
    runs-on: blacksmith-4vcpu-ubuntu-2204
    defaults:
      run:
        working-directory: packages/openclaw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - name: Build
        run: pnpm build

      # The postbuild step regenerates openclaw.plugin.json from
      # src/config-schema.ts; the checked-in copy must stay in sync (it's
      # what the npm package stages and what installers read from git).
      - name: Check openclaw.plugin.json is up to date
        run: |
          git diff --exit-code openclaw.plugin.json || \
            (echo "::error::openclaw.plugin.json is stale. Run 'pnpm build' in packages/openclaw and commit the regenerated manifest." && exit 1)

      - name: Run unit tests
        run: npx vitest run src/ --exclude src/config-schema.test.ts

      - name: Verify cron budget startup holds
        run: node scripts/test-cron-budget-bootstrap.mjs

      - name: Run security tests
        run: npx vitest run src/security.test.ts

  integration-test:
    name: Bot E2E (${{ matrix.shard }})
    runs-on: blacksmith-8vcpu-ubuntu-2204
    # One stack per shard: the baseline and cron scenario partitions and the
    # package suite. Each stack boots fresh and re-applies the branch %groups
    # desk (13-15 min with three ships), so running them in series cost ~64
    # min; sharding runs the three applies in parallel. The ceiling sits
    # above cold setup ~15 + the 45-min step cap + the 5-min failure capture
    # + upload, so a step that runs to its cap hits a *step* timeout (a step
    # failure), never this job timeout (a cancellation) — the capture steps
    # below then still run with the orphaned stack alive.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: baseline
            id: b
            script: test:e2e:openclaw
            partitions: baseline
          - shard: cron
            id: c
            script: test:e2e:openclaw
            partitions: cron
          - shard: package
            id: p
            script: test:e2e:openclaw:package
    defaults:
      run:
        working-directory: .
    env:
      # assemble-desk.sh runs `peru sync` unless told otherwise, and
      # branch-desk.ts caps an assemble at 300s — a cold sync has measured
      # 277s. The step below syncs once, unbounded. See TLON-6338.
      SKIP_SYNC: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install peru
        run: pipx install --force peru

      - name: Cache vendored desk dependencies
        id: desk-deps
        uses: actions/cache@v4
        with:
          path: desk-deps
          # The picked output is 25 files (~150K) and fully determined by
          # peru.yaml's pins; peru's own .peru/ cache holds full clones (~800MB).
          key: tlon-desk-deps-${{ hashFiles('peru.yaml') }}

      - name: Sync desk dependencies
        if: steps.desk-deps.outputs.cache-hit != 'true'
        run: ./scripts/sync-deps.sh

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The harness cross-compiles the workspace tlon CLI for the container
      # (openclaw driver beforeComposeBuild). Pin matches tlon-skill-publish.yml.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - name: Typecheck shared E2E harness
        if: matrix.shard == 'baseline'
        run: pnpm --filter '@tloncorp/tlon-bot-e2e' tsc

      - name: Run shared E2E unit tests
        if: matrix.shard == 'baseline'
        run: pnpm --filter '@tloncorp/tlon-bot-e2e' test:unit

      - name: Build OpenClaw
        run: pnpm --filter '@tloncorp/openclaw' build

      - name: Cache fake ship archives
        uses: actions/cache@v4
        with:
          path: .cache/tlon-bot-e2e/fake-ships
          # Keyed on the compose file so a pier-generation bump rolls the
          # cache: Actions caches are immutable, and a stale exact-key hit
          # would leave every job re-downloading ~1GB of archives forever.
          key:
            tlon-bot-e2e-fake-ships-${{
            hashFiles('packages/tlon-bot-e2e/docker/docker-compose.base.yml') }}

      - name: Prepare fake ship cache
        run: mkdir -p .cache/tlon-bot-e2e/fake-ships

      - name: Run OpenClaw shared E2E
        timeout-minutes: 45
        env:
          # Only the package suite uses these; the driver would strip them
          # from the common partitions anyway.
          TLONBOT_TOKEN: ${{ matrix.shard == 'package' && secrets.TLONBOT_TOKEN || '' }}
          BRAVE_API_KEY: ${{ matrix.shard == 'package' && secrets.BRAVE_API_KEY || '' }}
          # Reuse the S3 test-storage secrets already configured for the
          # tlon-web e2e suite (same S3-compatible ship-storage setup).
          TEST_STORAGE_ENDPOINT: ${{ matrix.shard == 'package' && secrets.E2E_S3_ENDPOINT || '' }}
          TEST_STORAGE_BUCKET: ${{ matrix.shard == 'package' && secrets.E2E_S3_BUCKET_NAME || '' }}
          TEST_STORAGE_ACCESS_KEY: ${{ matrix.shard == 'package' && secrets.E2E_S3_ACCESS_KEY_ID || '' }}
          TEST_STORAGE_SECRET_KEY: ${{ matrix.shard == 'package' && secrets.E2E_S3_SECRET_ACCESS_KEY || '' }}
          TEST_STORAGE_REGION: ${{ matrix.shard == 'package' && secrets.E2E_S3_REGION || '' }}
          TEST_LIVE_TOOL_TRACE: "1"
          TEST_LIVE_TOOL_TRACE_CONTENTS: "1"
          FAKE_SHIP_CACHE_DIR:
            ${{ github.workspace }}/.cache/tlon-bot-e2e/fake-ships
          # Compact: run.ts appends the stack key and truncates at 32 chars.
          TLON_BOT_E2E_RUN_ID:
            ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          # Ignored by the package suite.
          TLON_BOT_E2E_SCENARIO_PARTITIONS: ${{ matrix.partitions }}
        run: |
          pnpm --filter '@tloncorp/tlon-bot-e2e' ${{ matrix.script }}

      - name: Capture leftover docker state
        if: failure() || cancelled()
        timeout-minutes: 5
        run:
          bash ./packages/tlon-bot-e2e/scripts/capture-docker-state.sh
          packages/tlon-bot-e2e/diagnostics/docker-state

      - name: Upload E2E diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          # run_attempt: v4 artifact names are immutable across attempts of a
          # run — a rerun of a failed job must not collide with the previous
          # attempt's upload, or the rerun's diagnostics are rejected.
          name: tlon-bot-e2e-diagnostics-openclaw-${{ matrix.shard }}-${{ github.run_attempt }}
          path: packages/tlon-bot-e2e/diagnostics/
          if-no-files-found: warn
          retention-days: 7
