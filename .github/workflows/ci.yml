name: CI (Test and Build)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # Detect which parts of the monorepo changed so downstream jobs can skip
  # work that the change set can't affect. `app` is an ignore-list: it's true
  # for ANY change except ones confined to the isolated bot/plugin packages
  # (openclaw/hermes/tlon-bot-e2e/tlon-skill — not consumed by the app, covered
  # by their own workflows) or docs. New packages therefore default to running
  # the app suite, so we never silently skip needed tests. `bots` mirrors that
  # package list positively; it gates the bot-checks job that keeps the checks
  # only test-build used to provide (see below) running on bot-only PRs.
  changes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      app: ${{ steps.filter-app.outputs.app }}
      backend: ${{ steps.filter.outputs.backend }}
      bots: ${{ steps.filter.outputs.bots }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      # An ignore-list filter only works with predicate-quantifier `every`:
      # a file counts only if it matches every pattern — `**` AND each `!`
      # exclusion. Under the default `some`, `**` matches everything and the
      # exclusions are dead letters (the pre-#6128 gating had this bug).
      # The quantifier is step-wide and `every` would break the positive
      # OR-lists below, so `app` gets its own step.
      - name: Filter changed paths (app ignore-list)
        uses: dorny/paths-filter@v3
        id: filter-app
        with:
          predicate-quantifier: "every"
          filters: |
            app:
              - '**'
              - '!packages/openclaw/**'
              - '!packages/hermes-tlon-adapter/**'
              - '!packages/tlon-bot-e2e/**'
              - '!packages/tlon-skill/**'
              - '!docs/**'
              - '!**/*.md'
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'desk/**'
              - 'backend/**'
            bots:
              - 'packages/openclaw/**'
              - 'packages/hermes-tlon-adapter/**'
              - 'packages/tlon-bot-e2e/**'
              - 'packages/tlon-skill/**'
            # Where the app's ship requests are written. Not every call site
            # is here — the extractor also scans packages/app and the two app
            # roots, which hold about 7% of them — so a PR that adds a request
            # only in apps/tlon-web gets no report. The report is advisory, and
            # this keeps it off PRs that cannot have moved the inventory.
            client:
              - 'packages/api/**'
              - 'packages/shared/**'

  # The app-wide suite. Skipped only when the filter positively reported
  # app == 'false' (bot-/docs-only PRs). Written `!= 'false'` rather than
  # `== 'true'` to fail closed: if the changes job errors, its outputs are
  # empty and a plain `== 'true'` gate would skip the suite entirely.
  test-build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - name: Check native navigation icons
        run: pnpm check:native-navigation-icons

      - name: Check formatting
        run: pnpm format:check

      - name: Run Lint
        run: pnpm -r lint

      - name: Build editor package (allows us to run type checks)
        run: pnpm build:editor

      - name: Check Types
        run: pnpm -r tsc

      - name: Run Tests
        run: pnpm test:ci

      - name: tlon-skill build smoke
        run: pnpm --filter '@tloncorp/tlon-skill' build:smoke

      - name: Build packages
        run: pnpm build:all
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # Advisory: lists the requests this PR adds to, changes in, or drops from the
  # set the client makes of the desk, so a reviewer can check each one against
  # the N-1 desk (docs/tlon-apps/desk-compatibility.md, AGENTS.md).
  #
  # Deliberately *not* in `ci-ok`'s needs, unlike the other filter-gated jobs.
  # No inventory change is wrong on its face — whether N-1 serves a request is
  # a judgement a person makes — so this must never stand between a PR and its
  # merge gate. Nothing in it is allowed to fail the job either.
  desk-requests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.client == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    name: Desk Requests Report
    # One run per PR: a superseded push has nothing to say about the head, and
    # its report would only race the newer one.
    concurrency:
      group: desk-requests-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      # The report is posted as a sticky PR comment.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `git merge-base` needs the base branch's history, which the default
          # depth-1 checkout does not have. Blobless keeps the whole commit
          # graph cheap; the extractor's `git archive` pulls the blobs it reads
          # on demand.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      # The merge base, not the base branch tip: a request the base branch
      # gained since this one forked is not something this PR added.
      - name: Diff the desk request inventory
        id: report
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "diffing the inventory against merge base $MERGE_BASE"
          pnpm --silent check:desk-requests "$MERGE_BASE" --markdown \
            | tee desk-requests.md

      # The comment is sticky, so an empty file would leave the previous push's
      # list standing as though it were this one's.
      - name: Guard against an empty report
        if: ${{ always() && steps.report.outcome != 'skipped' }}
        run: |
          if [ ! -s desk-requests.md ]; then
            printf '## Desk requests\n\nThe report could not be produced for this push; see the job log.\n' > desk-requests.md
          fi

      # The summary is always written; it is the only place the report lands on
      # a fork or bot PR, where the token cannot comment.
      - name: Write the report to the job summary
        if: ${{ always() && steps.report.outcome != 'skipped' }}
        run: cat desk-requests.md >> "$GITHUB_STEP_SUMMARY"

      # One sticky comment, edited in place, so a PR does not collect one per
      # push. A fork PR and Dependabot both get a read-only token, so posting
      # would fail a job for a report that is already in the summary — skipped
      # there, and never fatal anywhere.
      - name: Post the desk requests report
        if: >-
          ${{ always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
          && github.actor != 'dependabot[bot]'
          && steps.report.outcome != 'skipped' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Two pushes in quick succession race to edit the same comment, and
          # the slower run would leave a report for a commit nobody is looking
          # at. The head is stamped into the marker, and a run whose head is no
          # longer the PR's simply stands down.
          CURRENT=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [ "$CURRENT" != "$HEAD_SHA" ]; then
            echo "head moved from $HEAD_SHA to $CURRENT; leaving the comment alone"
            exit 0
          fi
          PREFIX='<!-- desk-requests-report'
          printf '%s head=%s -->\n\n' "$PREFIX" "$HEAD_SHA" > body.md
          cat desk-requests.md >> body.md
          # Matched on the prefix, so a comment written before the head was
          # stamped in is still the one that gets edited rather than a second
          # one appearing beside it. --jq runs per page, so `first` would pick
          # one match per page; collect every id and take the earliest. `awk`
          # rather than `head`, which would close the pipe on a long thread and
          # trip pipefail on gh's half-written page.
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$PREFIX\")) | .id" \
            | awk 'NR == 1')
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@body.md >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null
          fi

  # Unit-level checks for the bot/plugin packages, mirroring what test-build's
  # repo-wide format/lint/tsc/test:ci ran for them before gating. Only
  # needed when test-build is skipped (bot-only PRs); on mixed PRs test-build
  # covers all of this. The openclaw and tlon-bot-e2e unit steps duplicate
  # jobs in the path-triggered hermes-ci/openclaw-ci workflows, on purpose:
  # those workflows can't be required status checks (a paths-filtered workflow
  # never reports on unrelated PRs, wedging a required context), so this job
  # is what puts that coverage behind the CI OK merge gate. Their heavyweight
  # shared-E2E suites stay in the plugin workflows only, non-blocking.
  bot-checks:
    needs: changes
    if:
      needs.changes.outputs.app == 'false' && needs.changes.outputs.bots ==
      'true'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    name: Bot Package Checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - name: Check formatting (bot packages)
        run:
          pnpm exec oxfmt --check packages/openclaw packages/tlon-skill
          packages/tlon-bot-e2e

      - name: Lint OpenClaw
        run: pnpm --filter '@tloncorp/openclaw' lint

      - name: Run OpenClaw unit and security tests
        run: pnpm --filter '@tloncorp/openclaw' test

      - name: tlon-bot-e2e typecheck and unit tests
        run: |
          pnpm --filter '@tloncorp/tlon-bot-e2e' tsc
          pnpm --filter '@tloncorp/tlon-bot-e2e' test:unit

      - name: tlon-skill typecheck, tests, and build smoke
        run: pnpm --filter '@tloncorp/tlon-skill' check

      - name: Run Hermes adapter unit tests
        run: ./packages/hermes-tlon-adapter/dev/test.sh

      # The drift contract lives in @tloncorp/shared (it owns the static
      # command lists) but its whole purpose is catching runtime changes — and
      # a bot-only PR skips test-build, where the shared suite runs. Without
      # this step, editing a runtime's command registry could never turn it red.
      - name: Bot command drift contract
        run:
          pnpm --filter '@tloncorp/shared' test run
          src/domain/runtimeCommandContract.test.ts

  # Merge gate: the single required status check for this repo ("CI OK" in
  # branch protection). It aggregates the conditionally-skipped jobs above
  # into one context that always reports: a skipped need is fine (the filter
  # said that suite wasn't relevant to the diff), but any failure or
  # cancellation — including the changes job itself erroring — fails the
  # gate. `always()` (not `!cancelled()`) so a cancelled run reports a
  # failure instead of a skip, which would satisfy the required check.
  # When adding a new filter-gated job, append it to `needs` here — unless it
  # is advisory by design, as `desk-requests` is, in which case say so on the
  # job rather than wiring it into the gate.
  ci-ok:
    name: CI OK
    needs: [changes, test-build, bot-checks]
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Verify gated jobs succeeded or were skipped
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A gated job reported '$result'"
              exit 1
            fi
          done
          echo "All gated jobs succeeded or were skipped."

  # Production-build smoke test. The parallel e2e suite runs against the Vite
  # *dev* server; this boots the minified `vite build` output to catch
  # prod-only runtime errors (transpilation/minification breakage) that the dev
  # build can't surface. Front-end concern → gated on `app`.
  smoke-test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    name: Production Build Smoke Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - name: Build packages
        run: pnpm build:all
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Get Playwright version
        id: playwright-version
        run:
          echo "version=$(node -p
          "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT
        working-directory: ./apps/tlon-web

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key:
            playwright-${{ runner.os }}-${{
            steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
        working-directory: ./apps/tlon-web

      - name: Install peru
        # rube runs `peru sync` to vendor desk deps into desk-deps/ before
        # assembling ship desks. (The parallel e2e job gets peru from the rube
        # Docker image; this smoke test runs on the bare runner.)
        run:
          pipx install peru || pip install --user peru || pip3 install --user
          --break-system-packages peru

      - name: Run Production Build Smoke Test
        id: smoke-test
        run:
          pnpm e2e:prod:smoke:force || (echo "::warning::Production smoke test
          failed, retrying..." && pnpm e2e:prod:smoke:force)
        working-directory: ./apps/tlon-web
        continue-on-error: false

      - name: Upload Production Test Artifacts
        if: failure() && steps.smoke-test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-test-results
          path: |
            ./apps/tlon-web/test-results/
            ./apps/tlon-web/playwright-report/
          retention-days: 7

  # Backend tests
  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    name: Backend Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install peru
        # run-tests.sh assembles the groups desk via scripts/assemble-desk.sh,
        # which runs `peru sync` to vendor desk deps (desk-deps/) — including
        # peru-only deps like sur/mcp-proxy that aren't in the test pill.
        run: |
          pipx install peru || pip install --user peru || pip3 install --user --break-system-packages peru
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Backend Tests for Groups
        run: |
          sudo apt-get update
          sudo apt-get install -y socat patch
          ./backend/run-tests.sh
  # Parallel E2E Tests using Docker containers
  e2e-parallel:
    needs: changes
    if:
      needs.changes.outputs.app == 'true' || needs.changes.outputs.backend ==
      'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    name: E2E Tests (Parallel - 4 shards)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - name: Build E2E Docker Image
        run: |
          cd apps/tlon-web
          pnpm e2e:parallel:build

      - name: Run E2E Tests (Parallel)
        env:
          TOTAL_SHARDS: 4
          INCLUDE_OPTIONAL_SHIPS: false
          E2E_S3_ENDPOINT: ${{ secrets.E2E_S3_ENDPOINT }}
          E2E_S3_ACCESS_KEY_ID: ${{ secrets.E2E_S3_ACCESS_KEY_ID }}
          E2E_S3_SECRET_ACCESS_KEY: ${{ secrets.E2E_S3_SECRET_ACCESS_KEY }}
          E2E_S3_BUCKET_NAME: ${{ secrets.E2E_S3_BUCKET_NAME }}
          E2E_S3_REGION: ${{ secrets.E2E_S3_REGION }}
        run: |
          cd apps/tlon-web
          pnpm e2e:parallel

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            apps/tlon-web/test-results/merged-report/
            apps/tlon-web/test-results/junit-merged.xml
            apps/tlon-web/test-results/logs/
            apps/tlon-web/test-results/shard-*/
          retention-days: 30
