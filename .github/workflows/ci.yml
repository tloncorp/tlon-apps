name: CI (Test and Build)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # Detect which parts of the monorepo changed so downstream jobs can skip
  # work that the change set can't affect. `app` is an ignore-list: it's true
  # for ANY change except ones confined to the isolated bot/plugin packages
  # (openclaw/hermes/tlon-bot-e2e/tlon-skill — not consumed by the app, covered
  # by their own workflows) or docs. New packages therefore default to running
  # the app suite, so we never silently skip needed tests. `bots` mirrors that
  # package list positively; it gates the bot-checks job that keeps the checks
  # only test-build used to provide (see below) running on bot-only PRs.
  #
  # The two filters are different shapes, so "classified" means different
  # things in each: in the ignore-list, a package is classified by the
  # ABSENCE of an exclusion; in a positive list, by the PRESENCE of an entry.
  # A package excluded from `app` and named in no positive filter matches
  # nothing, so every gated job skips and CI OK goes green over a diff
  # nothing looked at. `ci-config-check` below runs
  # scripts/check-ci-path-filters.mjs to make that unrepresentable.
  changes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      app: ${{ steps.filter-app.outputs.app }}
      backend: ${{ steps.filter.outputs.backend }}
      bots: ${{ steps.filter.outputs.bots }}
    steps:
      # An ignore-list filter only works with predicate-quantifier `every`:
      # a file counts only if it matches every pattern — `**` AND each `!`
      # exclusion. Under the default `some`, `**` matches everything and the
      # exclusions are dead letters (the pre-#6128 gating had this bug).
      # The quantifier is step-wide and `every` would break the positive
      # OR-lists below, so `app` gets its own step.
      - name: Filter changed paths (app ignore-list)
        uses: dorny/paths-filter@v3
        id: filter-app
        with:
          predicate-quantifier: "every"
          filters: |
            app:
              - '**'
              # packages/surface-shell is deliberately NOT excluded: the app
              # embeds the built shell in its sandbox host, so a shell-only
              # change must run the app suite. Not excluding it IS its
              # classification here.
              - '!packages/openclaw/**'
              - '!packages/hermes-tlon-adapter/**'
              - '!packages/tlon-bot-e2e/**'
              - '!packages/tlon-skill/**'
              - '!docs/**'
              - '!**/*.md'
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'desk/**'
              - 'backend/**'
            bots:
              - 'packages/openclaw/**'
              - 'packages/hermes-tlon-adapter/**'
              - 'packages/tlon-bot-e2e/**'
              - 'packages/tlon-skill/**'
              # The shell has two consumers: packages/app and tlon-skill's
              # surface preview. Listing it here is inert today (a shell
              # change also sets app=true, and bot-checks requires
              # app == 'false'), and that is the point: if anyone ever
              # excludes the shell from `app` believing it to be
              # bot-only, bot-checks picks it up instead of nothing at all.
              - 'packages/surface-shell/**'

  # A guard on the gating itself, and the only job here with no `needs` and
  # no `if`. That is deliberate: the defect it catches is a workspace package
  # that no path filter selects, and such a package skips every filter-gated
  # job by definition — so a gated guard could never see it. Cheap enough to
  # pay for on every PR (checkout + node, no install; the script has no
  # dependencies).
  ci-config-check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    name: CI Config Check
    steps:
      - name: Checkout
        # Full history, not the default single commit: the claims-index check
        # below diffs the commit that index records against HEAD, and a shallow
        # clone does not contain the recorded commit.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Every workspace package is classified by a path filter
        run: node scripts/check-ci-path-filters.mjs

      # Same reasoning as the check above, applied to the decision record: a
      # stray DECISIONS.md matches no path filter, so only an ungated job can
      # see it. Three entries have already been written to the wrong file.
      - name: The decision record is single, rooted, and covers what is cited
        run: node scripts/check-decisions-record.mjs

      # And again for the claims index, which is a root markdown matching no
      # filter. It names the commit it was measured at; this fails when a file
      # it cites has moved since, when a citation points at a file or a line
      # that is gone, or when the header goes back to describing a tree instead
      # of a commit — the state the first revision of it shipped in.
      - name: The claims index names a commit and still describes it
        run: node scripts/check-claims-index.mjs

  # The app-wide suite. Skipped only when the filter positively reported
  # app == 'false' (bot-/docs-only PRs). Written `!= 'false'` rather than
  # `== 'true'` to fail closed: if the changes job errors, its outputs are
  # empty and a plain `== 'true'` gate would skip the suite entirely.
  test-build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - name: Check native navigation icons
        run: pnpm check:native-navigation-icons

      - name: Check formatting
        run: pnpm format:check

      - name: Run Lint
        run: pnpm -r lint

      - name: Build editor package (allows us to run type checks)
        run: pnpm build:editor

      - name: Build surface-shell package (allows us to run type checks)
        run: pnpm build:surface-shell

      - name: Check Types
        run: pnpm -r tsc

      # The shell's four boundary checks: import allowlist, style boundary,
      # token drift, deterministic build. They existed and ran NOWHERE — not in
      # `pnpm -r lint` (oxlint only), not in `test:ci` (vitest only) — while the
      # plan and the PR description both claimed they were CI-enforced, and
      # `check-token-drift.mjs` asserted in its own output that it "fails CI
      # when this file is stale". Wired rather than the claim weakened, since
      # all four pass today.
      - name: Surface shell boundary checks
        run: pnpm --filter '@tloncorp/surface-shell' check:all

      - name: Run Tests
        run: pnpm test:ci

      # `surface preview`'s headless leg is the only check in the repo that
      # renders a surface bundle through the real shell in real Chromium, the
      # way a phone renders it. It is opt-in (TLON_PREVIEW_BROWSER) so the
      # suite stays runnable on a machine with no browser binaries, which is
      # exactly why it needs an explicit step: `pnpm test:ci` above runs the
      # tlon-skill suite with the leg silently skipped.
      #
      # It lives in BOTH this job and bot-checks. The two are mutually
      # exclusive by construction (`app != 'false'` vs `app == 'false'`), so
      # this is not double cost — whichever one the PR runs pays it once.
      # Putting it only here would have left bot-only PRs (which skip
      # test-build entirely) without it, i.e. the same bug for the opposite
      # diff shape.
      #
      # The cache key matches smoke-test's and bot-checks' by coincidence,
      # not design: apps/tlon-web's @playwright/test and packages/tlon-skill's
      # playwright happen to resolve the same version today, so the entries
      # share and the browser is usually already warm. If they diverge the
      # keys diverge too and each job just downloads its own — correct, only
      # slower.
      - name: Get tlon-skill Playwright version
        id: skill-playwright-version
        run: echo "version=$(node -p
          "require('playwright/package.json').version")" >> $GITHUB_OUTPUT
        working-directory: ./packages/tlon-skill

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: skill-playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{
            steps.skill-playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.skill-playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./packages/tlon-skill

      # Two files, one browser gate. surface-preview.test.ts covers the
      # renderer; surface-templates.test.ts runs the machine defect pass over
      # every SHIPPED TEMPLATE, which is the leg that was missing — the gate
      # cannot see geometry, and `workout-tracker` shipped with a tap-target
      # defect in all twelve cells that three separate agents each found by
      # hand.
      - name: Surface preview headless capture
        run: bun test ./scripts/surface-preview.test.ts
          ./scripts/surface-templates.test.ts
        working-directory: ./packages/tlon-skill
        env:
          TLON_PREVIEW_BROWSER: "1"

      - name: tlon-skill build smoke
        run: pnpm --filter '@tloncorp/tlon-skill' build:smoke

      - name: Build packages
        run: pnpm build:all
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # Unit-level checks for the bot/plugin packages, mirroring what test-build's
  # repo-wide format/lint/tsc/test:ci ran for them before gating. Only
  # needed when test-build is skipped (bot-only PRs); on mixed PRs test-build
  # covers all of this. The openclaw and tlon-bot-e2e unit steps duplicate
  # jobs in the path-triggered hermes-ci/openclaw-ci workflows, on purpose:
  # those workflows can't be required status checks (a paths-filtered workflow
  # never reports on unrelated PRs, wedging a required context), so this job
  # is what puts that coverage behind the CI OK merge gate. Their heavyweight
  # shared-E2E suites stay in the plugin workflows only, non-blocking.
  bot-checks:
    needs: changes
    if: needs.changes.outputs.app == 'false' && needs.changes.outputs.bots ==
      'true'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    name: Bot Package Checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - name: Check formatting (bot packages)
        run: pnpm exec oxfmt --check packages/openclaw packages/tlon-skill
          packages/tlon-bot-e2e

      - name: Lint OpenClaw
        run: pnpm --filter '@tloncorp/openclaw' lint

      - name: Run OpenClaw unit and security tests
        run: pnpm --filter '@tloncorp/openclaw' test

      - name: tlon-bot-e2e typecheck and unit tests
        run: |
          pnpm --filter '@tloncorp/tlon-bot-e2e' tsc
          pnpm --filter '@tloncorp/tlon-bot-e2e' test:unit

      # tlon-skill's preview imports the shell's BUILT artifact
      # (`@tloncorp/surface-shell/artifact-strings` resolves through the
      # package's exports map to dist/artifactStrings.js) and its test reads
      # dist/surface-shell.{js,css} off disk. dist/ is gitignored, so without
      # this step the whole tlon-skill suite dies at module load on a clean
      # checkout ("Cannot find module '@tloncorp/surface-shell/artifact-
      # strings'"). It is the `pnpm test` half of `check` that dies, not the
      # typecheck: tsc runs moduleResolution:Node, cannot follow an exports
      # subpath at all, and the imports carry @ts-expect-error for that — so
      # the typecheck is green with or without dist and proves nothing here.
      # test-build builds the shell near the top for the same reason.
      - name: Build surface-shell package (tlon-skill imports its dist)
        run: pnpm build:surface-shell

      # `surface preview` is the only check that renders a bundle the way a
      # phone will, so its headless leg has to actually run here. It is
      # opt-in (TLON_PREVIEW_BROWSER) so the suite stays runnable on a
      # machine with no browser binaries — which meant that until this step
      # existed it ran nowhere, while a comment in the test asserted CI ran
      # it. test-build carries the same leg; the two jobs are mutually
      # exclusive, so it runs exactly once per PR either way.
      - name: Get tlon-skill Playwright version
        id: skill-playwright-version
        run: echo "version=$(node -p
          "require('playwright/package.json').version")" >> $GITHUB_OUTPUT
        working-directory: ./packages/tlon-skill

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: skill-playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{
            steps.skill-playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.skill-playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./packages/tlon-skill

      - name: tlon-skill typecheck, tests, and build smoke
        run: pnpm --filter '@tloncorp/tlon-skill' check
        env:
          TLON_PREVIEW_BROWSER: "1"

      - name: Run Hermes adapter unit tests
        run: ./packages/hermes-tlon-adapter/dev/test.sh

      # The drift contract lives in @tloncorp/shared (it owns the static
      # command lists) but its whole purpose is catching runtime changes — and
      # a bot-only PR skips test-build, where the shared suite runs. Without
      # this step, editing a runtime's command registry could never turn it red.
      - name: Bot command drift contract
        run: pnpm --filter '@tloncorp/shared' test run
          src/domain/runtimeCommandContract.test.ts

  # Merge gate: the single required status check for this repo ("CI OK" in
  # branch protection). It aggregates the conditionally-skipped jobs above
  # into one context that always reports: a skipped need is fine (the filter
  # said that suite wasn't relevant to the diff), but any failure or
  # cancellation — including the changes job itself erroring — fails the
  # gate. `always()` (not `!cancelled()`) so a cancelled run reports a
  # failure instead of a skip, which would satisfy the required check.
  # When adding a new job that must block merges — filter-gated or not, like
  # ci-config-check — append it to `needs` here.
  ci-ok:
    name: CI OK
    needs: [changes, ci-config-check, test-build, bot-checks, sandbox-posture]
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Verify gated jobs succeeded or were skipped
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A gated job reported '$result'"
              exit 1
            fi
          done
          echo "All gated jobs succeeded or were skipped."

  # Production-build smoke test. The parallel e2e suite runs against the Vite
  # *dev* server; this boots the minified `vite build` output to catch
  # prod-only runtime errors (transpilation/minification breakage) that the dev
  # build can't surface. Front-end concern → gated on `app`.
  smoke-test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    name: Production Build Smoke Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - name: Build packages
        run: pnpm build:all
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p
          "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT
        working-directory: ./apps/tlon-web

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{
            steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
        working-directory: ./apps/tlon-web

      - name: Install peru
        # rube runs `peru sync` to vendor desk deps into desk-deps/ before
        # assembling ship desks. (The parallel e2e job gets peru from the rube
        # Docker image; this smoke test runs on the bare runner.)
        run: pipx install peru || pip install --user peru || pip3 install --user
          --break-system-packages peru

      - name: Run Production Build Smoke Test
        id: smoke-test
        run:
          pnpm e2e:prod:smoke:force || (echo "::warning::Production smoke test
          failed, retrying..." && pnpm e2e:prod:smoke:force)
        working-directory: ./apps/tlon-web
        continue-on-error: false

      - name: Upload Production Test Artifacts
        if: failure() && steps.smoke-test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-test-results
          path: |
            ./apps/tlon-web/test-results/
            ./apps/tlon-web/playwright-report/
          retention-days: 7

  # The sandbox posture matrix: the only behavioral check that the surface
  # sandbox still contains an untrusted bundle. Until now nothing ran it in
  # CI, so per-PR protection was the CSP *string* pinned in a unit test —
  # which a change to the iframe flags, the document assembly, or the host
  # policy passes untouched.
  #
  # All three engines, deliberately. The vectors diverge by engine (the
  # Navigation API exists only on chromium; a refused navigation destroys
  # the frame on chromium and does not on firefox/webkit), so a
  # chromium-only run would license a claim the matrix makes about three.
  #
  # Gated on `app` — the same filter as the app suite — because the two
  # things it measures both live under it: `apps/tlon-web/**` (the host
  # page, the CSP, the specs) and `packages/surface-shell/**` (the document
  # assembly and the shell artifact), the latter deliberately not excluded
  # from `app` for exactly this reason (see the filter's own comment).
  sandbox-posture:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Sandbox Posture (3 engines)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      # the suite reads dist/surface-shell.{js,css} and fails loudly if the
      # artifact is missing, so this is a prerequisite rather than a warmup
      - name: Build surface-shell artifact
        run: pnpm build:surface-shell

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p
          "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT
        working-directory: ./apps/tlon-web

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-posture-${{ runner.os }}-${{
            steps.playwright-version.outputs.version }}

      # Two steps on purpose. The cache above holds BROWSER BINARIES
      # (~/.cache/ms-playwright); the apt packages webkit needs to launch —
      # libwoff2dec, gstreamer, and the rest — are installed on the ephemeral
      # runner and are not in it. The first version of this job ran
      # `install --with-deps` only on a cache miss, so it passed its first run
      # (cold cache, deps installed) and failed its second (warm cache, no
      # deps: `MiniBrowser: error while loading shared libraries:
      # libwoff2dec.so.1.0.2`), taking CI OK down on a docs-only push. System
      # deps install every run; only the binaries are cached.
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium firefox webkit
        working-directory: ./apps/tlon-web

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium firefox webkit
        working-directory: ./apps/tlon-web

      - name: Run sandbox posture matrix
        id: posture
        run: pnpm e2e:sandbox
        working-directory: ./apps/tlon-web
        env:
          SANDBOX_ENGINES: all

      - name: Upload posture artifacts
        if: failure() && steps.posture.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-posture-results
          path: ./apps/tlon-web/test-results/
          retention-days: 7

  # Backend tests
  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    name: Backend Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install peru
        # run-tests.sh assembles the groups desk via scripts/assemble-desk.sh,
        # which runs `peru sync` to vendor desk deps (desk-deps/) — including
        # peru-only deps like sur/mcp-proxy that aren't in the test pill.
        run: |
          pipx install peru || pip install --user peru || pip3 install --user --break-system-packages peru
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Backend Tests for Groups
        run: |
          sudo apt-get update
          sudo apt-get install -y socat patch
          ./backend/run-tests.sh
  # Parallel E2E Tests using Docker containers
  e2e-parallel:
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.backend ==
      'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    name: E2E Tests (Parallel - 4 shards)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - name: Build E2E Docker Image
        run: |
          cd apps/tlon-web
          pnpm e2e:parallel:build

      - name: Run E2E Tests (Parallel)
        env:
          TOTAL_SHARDS: 4
          INCLUDE_OPTIONAL_SHIPS: false
          E2E_S3_ENDPOINT: ${{ secrets.E2E_S3_ENDPOINT }}
          E2E_S3_ACCESS_KEY_ID: ${{ secrets.E2E_S3_ACCESS_KEY_ID }}
          E2E_S3_SECRET_ACCESS_KEY: ${{ secrets.E2E_S3_SECRET_ACCESS_KEY }}
          E2E_S3_BUCKET_NAME: ${{ secrets.E2E_S3_BUCKET_NAME }}
          E2E_S3_REGION: ${{ secrets.E2E_S3_REGION }}
        run: |
          cd apps/tlon-web
          pnpm e2e:parallel

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            apps/tlon-web/test-results/merged-report/
            apps/tlon-web/test-results/junit-merged.xml
            apps/tlon-web/test-results/logs/
            apps/tlon-web/test-results/shard-*/
          retention-days: 30
