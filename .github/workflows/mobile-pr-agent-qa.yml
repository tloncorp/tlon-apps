name: Hosted PR agent QA
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing PR to assess and test
        type: string
        required: true
      qa_ref:
        description: Optional source-verified QA overlay ref before this workflow lands
        type: string
      build_id:
        description: Optional existing simulator build to reuse
        type: string
      build_sha:
        description: Existing build commit, verified independently by EAS
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: hosted-pr-agent-qa-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    outputs:
      pr: ${{ steps.prepare.outputs.pr }}
      assessment: ${{ steps.prepare.outputs.assessment }}
      decision: ${{ steps.prepare.outputs.decision }}
      ref: ${{ steps.prepare.outputs.ref }}
      build_id: ${{ steps.prepare.outputs.build_id }}
      build_sha: ${{ steps.prepare.outputs.build_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
      - id: prepare
        name: Assess the PR and reuse or prepare its build
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          QA_PR_NUMBER: ${{ inputs.pr_number }}
          QA_TARGET_REF: ${{ inputs.qa_ref || '' }}
          QA_BUILD_ID: ${{ inputs.build_id || '' }}
          QA_BUILD_SHA: ${{ inputs.build_sha || '' }}
        run: node scripts/agent-qa/cloud.mjs prepare
  test:
    needs: prepare
    if: ${{ needs.prepare.outputs.decision == 'test' }}
    runs-on: blacksmith-4vcpu-ubuntu-2204
    # Build is ready before leasing ships; allow queueing and one bounded QA job.
    timeout-minutes: 100
    env:
      PROOF_OUTPUT: ${{ github.workspace }}/proof-output
      QA_PR_JSON: ${{ needs.prepare.outputs.pr }}
      QA_SOURCE_SHA: ${{ fromJSON(needs.prepare.outputs.pr).head.sha }}
      QA_ASSESSMENT_JSON: ${{ needs.prepare.outputs.assessment }}
      QA_TARGET_REF: ${{ needs.prepare.outputs.ref }}
      QA_BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      QA_BUILD_SHA: ${{ needs.prepare.outputs.build_sha }}
      MAESTRO_RUN_TAG: ci${{ github.run_id }}a${{ github.run_attempt }}
      MAESTRO_APP_ID: io.tlon.groups
      MAESTRO_TEST_SHIP: "~zod"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Verify the checkout contains the requested product source
        run: |
          git fetch --no-tags --depth=1 origin "$QA_SOURCE_SHA"
          node --input-type=module -e "import {verifySource} from './scripts/agent-qa/common.mjs'; verifySource(JSON.parse(process.env.QA_PR_JSON).head.sha)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore prepared ships
        id: snapshot
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .proof-snapshot
          key: rube-prepared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desk/**', '!desk/commit.txt', 'desk-deps.yaml', 'justfile', 'scripts/backend/fetch-deps.sh', 'apps/tlon-web/e2e/shipManifest.json', 'scripts/agent-qa/runtime.json', 'scripts/agent-qa/runtime.mjs', 'apps/tlon-web/rube/**') }}
      - name: Setup just
        # rube assembles ship desks with the repository justfile.
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - name: Install ship and tunnel tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y netcat-openbsd tmux rsync
          command -v nginx
          java -version
          # fetch-deps.sh reads desk-deps.yaml with yq v4.
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 -o /tmp/yq
          chmod +x /tmp/yq
          curl -fsSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar xz -C /tmp
          echo /tmp >> "$GITHUB_PATH"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter tlon-web rube:compile
      - name: Start matching ships and restricted tunnel
        id: ships
        env:
          NGROK_AUTHTOKEN: ${{ secrets.MAESTRO_FAKE_SHIP_NGROK_TOKEN }}
          QA_TUNNEL_TOKEN: ${{ secrets.QA_TUNNEL_TOKEN }}
        run: bash .maestro/cloud-fakeship/start.sh
      - name: Run the EAS iOS agent against these ships
        id: qa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          QA_SHIP_URL: ${{ steps.ships.outputs.url }}
        run: node scripts/agent-qa/cloud.mjs review
      - name: Verify setup evidence
        if: always() && steps.ships.outcome == 'success'
        run: test -f "$PROOF_OUTPUT/peer-ready.json"
      - name: Snapshot validated backend after clean shutdown
        id: capture
        if: always() && steps.ships.outcome == 'success' && steps.snapshot.outputs.cache-hit != 'true'
        run: bash .maestro/cloud-fakeship/snapshot.sh
      - name: Save prepared ships
        if: always() && steps.capture.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .proof-snapshot
          key: ${{ steps.snapshot.outputs.cache-primary-key }}
      - name: Stop experiment processes
        if: always()
        run: |
          tmux kill-session -t proof-rube 2>/dev/null || true
          for name in ngrok; do
            file="$PROOF_OUTPUT/$name.pid"
            if [ -f "$file" ]; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done
          nginx -s stop -c "$RUNNER_TEMP/proof-nginx.conf" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pr-agent-qa-backend
          path: proof-output/
          retention-days: 3
