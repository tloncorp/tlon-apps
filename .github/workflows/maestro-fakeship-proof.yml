name: Maestro two-ship test
on:
  workflow_dispatch:
    inputs:
      cases:
        description: Comma-separated flows, or all
        default: all
        type: string
permissions:
  contents: read
concurrency:
  group: maestro-fakeship-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 70
    env:
      PROOF_CASES: ${{ inputs.cases || 'all' }}
      PROOF_OUTPUT: ${{ github.workspace }}/proof-output
      MAESTRO_RUN_TAG: ci${{ github.run_id }}a${{ github.run_attempt }}
      MAESTRO_APP_ID: io.tlon.groups
      MAESTRO_TEST_SHIP: '~zod'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Verify case selection
        run: node --test .maestro/cloud-fakeship/select-cases.test.mjs
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore prepared ships
        id: snapshot
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .proof-snapshot
          key: rube-prepared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desk/**', '!desk/commit.txt', 'desk-deps.yaml', 'justfile', 'scripts/backend/fetch-deps.sh', 'apps/tlon-web/rube/**', 'apps/tlon-web/e2e/shipManifest.json') }}
      - name: Setup just
        # rube assembles ship desks with the repository justfile.
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - name: Install ship and tunnel tools
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rsync
          for tool in nc tmux rsync nginx; do command -v "$tool"; done
          java -version
          # fetch-deps.sh reads desk-deps.yaml with yq v4.
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 -o /tmp/yq
          chmod +x /tmp/yq
          curl --connect-timeout 10 --max-time 60 -fsSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar xz -C /tmp
          echo /tmp >> "$GITHUB_PATH"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter tlon-web rube:compile
          pnpm --filter @tloncorp/tlon-bot-e2e exec tsx --test "$GITHUB_WORKSPACE/.maestro/cloud-fakeship/observe-absence.test.ts"
      - name: Start matching ships and restricted tunnel
        id: ships
        env:
          NGROK_AUTHTOKEN: ${{ secrets.MAESTRO_FAKE_SHIP_NGROK_TOKEN }}
        run: bash .maestro/cloud-fakeship/maestro-start.sh
      - name: Run existing Android binary on API 33
        id: maestro
        uses: mobile-dev-inc/action-maestro-cloud@854f4005c1ef637d20b7007d428d23afe17c9665
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          project-id: proj_01jjmcqhxneg69zpqdty84xqvt
          app-binary-id: 273b377ee26ecc6cd28fcbf395a33cf60fcad3f5
          workspace: proof-flows
          maestro-cli-version: 2.6.1
          device-model: pixel_6
          device-os: android-33
          name: fakeship-${{ github.run_id }}
          timeout: 30
          env: |
            MAESTRO_APP_ID=io.tlon.groups
            MAESTRO_TEST_SHIP=~zod
            MAESTRO_LOGIN_URL=${{ steps.ships.outputs.url }}
            MAESTRO_LOGIN_CODE=${{ steps.ships.outputs.code }}
            MAESTRO_RUN_TAG=${{ env.MAESTRO_RUN_TAG }}
      - name: Verify peer evidence
        if: always() && steps.ships.outcome == 'success'
        run: |
          deadline=$((SECONDS + 180))
          until test -f "$PROOF_OUTPUT/peer-result.json"; do
            if ! kill -0 "$(cat "$PROOF_OUTPUT/peer.pid")" 2>/dev/null; then
              cat "$PROOF_OUTPUT/peer.log"
              exit 1
            fi
            if ((SECONDS > deadline)); then
              cat "$PROOF_OUTPUT/peer.log"
              exit 1
            fi
            sleep 1
          done
          cat "$PROOF_OUTPUT/peer-result.json"
      # A failed UI assertion must not discard successfully prepared backends.
      - name: Snapshot prepared ships after clean shutdown
        id: prepared
        if: always() && steps.ships.outcome == 'success' && steps.snapshot.outputs.cache-hit != 'true'
        run: bash .maestro/cloud-fakeship/snapshot.sh
      - name: Save prepared ships
        if: always() && steps.prepared.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .proof-snapshot
          key: ${{ steps.snapshot.outputs.cache-primary-key }}
      - name: Stop test processes
        if: always()
        run: |
          tmux kill-session -t proof-rube 2>/dev/null || true
          for name in ngrok peer; do
            file="$PROOF_OUTPUT/$name.pid"
            if [ -f "$file" ]; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done
          nginx -s stop -c "$RUNNER_TEMP/proof-nginx.conf" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cloud-fakeship-proof
          path: proof-output/
          retention-days: 3
