name: Test existing mobile binary
on:
  workflow_dispatch:
    inputs:
      binary_id:
        description: Maestro Cloud binary ID from the intended build
        required: true
      flow:
        description: Reliability YAML filename (leave empty for the full suite)
        default: ''
      app_id:
        description: Application ID of the uploaded binary
        default: io.tlon.groups.preview
        required: true
      test_ship:
        description: Expected isolated test ship
        default: '~batbet-litnec'
        required: true
permissions:
  contents: read
concurrency:
  group: mobile-reliability-${{ inputs.binary_id }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Run reliability tests without rebuilding
        uses: mobile-dev-inc/action-maestro-cloud@854f4005c1ef637d20b7007d428d23afe17c9665
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          project-id: proj_01jjmcqhxneg69zpqdty84xqvt
          app-binary-id: ${{ inputs.binary_id }}
          workspace: .maestro/reliability/${{ inputs.flow }}
          maestro-cli-version: 2.6.1
          name: reliability-${{ github.run_id }}
          timeout: 60
          env: |
            MAESTRO_APP_ID=${{ inputs.app_id }}
            MAESTRO_TEST_SHIP=${{ inputs.test_ship }}
            MAESTRO_EMAIL=${{ secrets.MAESTRO_EMAIL }}
            MAESTRO_PASSWORD=${{ secrets.MAESTRO_PASSWORD }}
            MAESTRO_RUN_TAG=c${{ github.run_id }}a${{ github.run_attempt }}
