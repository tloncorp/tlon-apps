name: Feature Map

# Keeps the product guide's feature map true to the app's source. The script
# has no dependencies, so there is nothing to install and it takes seconds.
#
# It runs on every PR, with no path filter: entries cite files all over the
# repo (app packages, native Android and iOS, the desk, package manifests), and
# a filter that misses one lets a stale label through unnoticed.
#
# When this fails on a UI change, fix the map in the same PR. See
# docs/feature-map/README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: feature-map-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Feature map matches the app
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # Depth 2 brings in the base commit. On a pull request the checkout is
      # the PR merged into its base, so HEAD^1 is the base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Test the checker
        run: node --test scripts/feature-map.test.mjs

      - name: Check the feature map against the source
        run: node scripts/feature-map.mjs check

      - name: Check the guide's own quoted labels
        run: node scripts/feature-map.mjs labels packages/openclaw/skills/tlon-product-guide/SKILL.md

      # Not a gate. The checks above cannot see behaviour that changes behind
      # the same labels, so this lists the entries worth reading again.
      - name: List the entries this PR may have made untrue
        run: node scripts/feature-map.mjs affected --since HEAD^1 >> "$GITHUB_STEP_SUMMARY"
