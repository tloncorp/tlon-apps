name: Feature Map Promote

# Publishes the feature map to bots. The map in docs/feature-map
# follows develop; bots read the copy under skills/tlon-product-guide/references,
# which holds only what is true for the store build people have installed.
#
# Once a day this republishes that copy for the newest production build and
# opens a PR if anything changed: a new release, or a correction to the map
# since the last run. Dispatch it by hand to publish a correction sooner.

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "Release tag to publish for (default: the newest production build)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: feature-map-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Naming the shell turns on pipefail, so a failed promote is not hidden by
    # the `tee` after it.
    defaults:
      run:
        shell: bash

    steps:
      # Full history and tags: promote reads the app's source at the release.
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Pick the release
        id: release
        env:
          APP: ${{ inputs.app }}
        run: |
          if [ -z "$APP" ]; then
            ios=$(git tag --list 'ios-production-*' --sort=-v:refname | head -n 1)
            android=$(git tag --list 'android-production-*' --sort=-v:refname | head -n 1)
            if [ -z "$ios" ]; then
              echo "::error::No ios-production-* tag found" >&2
              exit 1
            fi
            # Publish for whichever store build is older, so the steps hold on
            # both phones.
            APP="$ios"
            if [ -n "$android" ] && [ "$(git rev-parse "$android^{commit}")" != "$(git rev-parse "$ios^{commit}")" ] \
              && git merge-base --is-ancestor "$android" "$ios"; then
              APP="$android"
            fi
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Publishing for $APP"

      - name: Check the map before publishing it
        run: node scripts/feature-map.mjs check

      # Read before promote overwrites it.
      - name: Note the release the published copy was written for
        id: previous
        run: echo "commit=$(node -p "require('./packages/openclaw/skills/tlon-product-guide/references/RELEASE.json').appCommit")" >> "$GITHUB_OUTPUT"

      - name: Promote
        env:
          APP: ${{ steps.release.outputs.app }}
        run: node scripts/feature-map.mjs promote --app "$APP" | tee "$RUNNER_TEMP/promote.log"

      # promote settles what the labels can settle. It cannot see behaviour
      # that changed behind the same labels, so this lists the published
      # entries whose code changed between the two releases, for a re-read.
      - name: List the entries to re-read
        env:
          APP: ${{ steps.release.outputs.app }}
          PREVIOUS: ${{ steps.previous.outputs.commit }}
        run: node scripts/feature-map.mjs affected --published --since "$PREVIOUS" --until "$APP" > "$RUNNER_TEMP/worklist.md"

      - name: Summarize
        env:
          APP: ${{ steps.release.outputs.app }}
          PREVIOUS: ${{ steps.previous.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/promote.log"
            echo '```'
            echo
            cat "$RUNNER_TEMP/worklist.md"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "Republishes the product guide's feature map for \`$APP\`."
            echo
            echo 'The files under `skills/tlon-product-guide/references/` are generated by `scripts/feature-map.mjs promote` from `docs/feature-map/`. Entries whose labels are not in the source of this release are held back and listed in `references/RELEASE.json`.'
            echo
            echo 'Review the diff as product copy the bot will read out: every changed entry should match what the released app shows. Merging restarts the internal bot fleet (`bot-harness-deploy.yml`); other fleets need a manual dispatch.'
            echo
            echo "## Not in the diff"
            echo
            echo "The app changed under the entries below between \`$PREVIOUS\` and \`$APP\`, and the checks cannot tell whether they are still true. Have them read against the code before merging. \`docs/feature-map/README.md\` (Re-reading at a release) says how."
            echo
            # GitHub rejects a description over 65,536 characters.
            if [ "$(wc -c < "$RUNNER_TEMP/worklist.md")" -gt 50000 ]; then
              echo "The list is too long to fit here. It is in the summary of [the run that opened this PR]($RUN_URL)."
            else
              cat "$RUNNER_TEMP/worklist.md"
            fi
          } > "$RUNNER_TEMP/body.md"

      # No PR is opened when the published copy is already up to date.
      - name: Open a PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: develop
          branch: release/feature-map-${{ steps.release.outputs.app }}
          delete-branch: true
          add-paths: |
            packages/openclaw/skills/tlon-product-guide
            docs/feature-map/release-anchors.json
          commit-message: "product guide: publish the feature map for ${{ steps.release.outputs.app }}"
          title: "product guide: publish the feature map for ${{ steps.release.outputs.app }}"
          body-path: ${{ runner.temp }}/body.md
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
