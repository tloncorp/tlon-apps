name: Agent QA harness checks
on:
  pull_request:
    paths:
      - scripts/agent-qa/**
      - .agents/skills/tlon-workflow/**
      - .maestro/cloud-fakeship/**
      - .github/workflows/mobile-pr-agent-qa.yml
      - apps/tlon-mobile/.eas/workflows/pr-agent-qa-ios.yml
      - .github/workflows/mobile-agent-qa-checks.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Install video test decoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - run: node --test scripts/agent-qa/*.test.mjs
