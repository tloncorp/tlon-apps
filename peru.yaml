# peru.yaml — vendor desk dependencies from upstream Urbit projects.
#
# Run `./scripts/sync-deps.sh` (or `peru sync`) to populate desk-deps/ with the
# files picked below. desk-deps/ is an entirely-gitignored vendored tree kept
# SEPARATE from our own source in desk/. A desk is assembled by copying
# desk-deps/ in first (with --delete) and then our desk/ on top — see
# scripts/assemble-desk.sh. The harness-* modules do the same for
# packages/harness/.
#
# Why peru instead of rsyncing all of pkg/base-dev: base-dev ships ~119 files
# (bitcoin, ethereum, wasm, language-server, azimuth, ...). Copying the whole
# tree in pulls files this desk does not use, some of which fail to compile on
# the target kelvin. We pick only the transitively-required subset.
#
# IMPORTANT: do NOT add anything this repo patches or owns to the pick lists.
# Notably desk/lib/verb.hoon is a locally-patched 3-arg variant and stays
# committed; lib/{strand,strandio,test} and the thread marks are app-local too.

imports:
  base: desk-deps/
  landscape: desk-deps/
  mcp: desk-deps/
  harness-base: packages/harness/desk-deps/
  harness-mcp: packages/harness/mcp/

# %base (urbit/urbit) dev dependencies. Pinned to the 408 kelvin tag, matching
# desk/sys.kelvin ([%zuse 408]).
git module base:
  url: https://github.com/urbit/urbit.git
  rev: 408k-rc2
  pick:
    # libraries the desk imports (transitive closure):
    #   default-agent -> skeleton; azimuth -> ethereum; ethereum/dbug standalone
    # azimuth is only reached via the aqua test framework (lib/aqua-azimuth ->
    # lib/ph/io), so it isn't built by a normal %groups commit, but the aqua
    # tests need it.
    - pkg/base-dev/lib/azimuth.hoon
    - pkg/base-dev/lib/dbug.hoon
    - pkg/base-dev/lib/default-agent.hoon
    - pkg/base-dev/lib/ethereum.hoon
    - pkg/base-dev/lib/mip.hoon
    - pkg/base-dev/lib/server.hoon
    - pkg/base-dev/lib/skeleton.hoon
    # thread types (spider sur; its /+ strand resolves to our local strand)
    - pkg/base-dev/sur/spider.hoon
    # %hood actions, used by the raze thread (ted/raze.hoon)
    - pkg/base-dev/sur/hood.hoon
    # standard marks clay needs to build/serve the desk
    - pkg/base-dev/mar/bill.hoon
    - pkg/base-dev/mar/hoon.hoon
    - pkg/base-dev/mar/kelvin.hoon
    - pkg/base-dev/mar/mime.hoon
    - pkg/base-dev/mar/noun.hoon
    - pkg/base-dev/mar/txt.hoon
    - pkg/base-dev/mar/css.hoon
    - pkg/base-dev/mar/json.hoon
    - pkg/base-dev/mar/htm.hoon
    - pkg/base-dev/mar/html.hoon
    # %tang is not needed to build the desk, only to report a failure out of
    # it: spider renders a crashed thread's stack through its outputMark, so
    # without this mark a thread that nacks on the %groups desk answers
    # [%no-cast-between %tang %json] and the real error is never seen.
    - pkg/base-dev/mar/tang.hoon
  export: pkg/base-dev

# %landscape (tloncorp/landscape) docket + settings types. No 408 tag exists
# yet; pinned to the 408 branch commit. Bump to a tag when landscape releases.
git module landscape:
  url: https://github.com/tloncorp/landscape.git
  rev: 5193635
  pick:
    - desk/lib/docket.hoon
    - desk/mar/docket-0.hoon
    - desk/sur/docket.hoon
    - desk/sur/settings.hoon
  export: desk

# %mcp (tloncorp/mcp) types for %notes' self-registration with a local
# %mcp-proxy. %notes pokes %mcp-proxy-action (see +register-with-mcp-proxy in
# app/notes.hoon), which needs the %mcp-proxy-action mark + its sur. Vendored
# rather than committed so the types track upstream. No 408 tag yet; pinned to
# a master commit (supports [%zuse 409] [%zuse 408]), shared with harness-mcp.
git module mcp:
  url: https://github.com/tloncorp/mcp.git
  rev: &mcp-rev 9600a823d2d6e49d47f436f98ecde0e832b732ee
  pick:
    - desk/mar/mcp-proxy-action.hoon
    - desk/sur/mcp-proxy.hoon
  export: desk

# Harness's %base (urbit/urbit) dev files, for its own desk. Pinned to the
# commit of the 408k-2 tag, separately from the %groups base module above so
# each desk moves its pin on its own. Its Tlon files come from desk/ instead;
# see packages/harness/tlon-files.txt.
git module harness-base:
  url: https://github.com/urbit/urbit.git
  rev: 5a187fededc4582a34fcd6055c67bb63e0917b94
  pick:
    # agents, threads and tests
    - pkg/base-dev/lib/dbug.hoon
    - pkg/base-dev/lib/default-agent.hoon
    - pkg/base-dev/lib/skeleton.hoon
    - pkg/base-dev/lib/strand.hoon
    - pkg/base-dev/lib/test.hoon
    - pkg/base-dev/sur/spider.hoon
    # WASM stack for the QuickJS %code tool (lib/thread-builder-js)
    - pkg/base-dev/lib/wasm/lia.hoon
    - pkg/base-dev/lib/wasm/parser.hoon
    - pkg/base-dev/lib/wasm/runner/engine.hoon
    - pkg/base-dev/lib/wasm/runner/op-def.hoon
    - pkg/base-dev/lib/wasm/validator.hoon
    - pkg/base-dev/sur/wasm/engine.hoon
    - pkg/base-dev/sur/wasm/lia.hoon
    - pkg/base-dev/sur/wasm/wasm.hoon
    # one mark per file type in the desk
    - pkg/base-dev/mar/bill.hoon
    - pkg/base-dev/mar/hoon.hoon
    - pkg/base-dev/mar/kelvin.hoon
    - pkg/base-dev/mar/wasm.hoon
    # marks the ones above delegate revision control to
    - pkg/base-dev/mar/mime.hoon
    - pkg/base-dev/mar/noun.hoon
    - pkg/base-dev/mar/txt.hoon
    # JSON pokes and scries through Eyre; error traces
    - pkg/base-dev/mar/json.hoon
    - pkg/base-dev/mar/tang.hoon
  export: pkg/base-dev

# The whole %mcp repository, which Harness's scripts build and install on its
# test ships (packages/harness/mcp/justfile). Same pin as the mcp module.
git module harness-mcp:
  url: https://github.com/tloncorp/mcp.git
  rev: *mcp-rev
