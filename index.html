<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f5f5" id="theme-color" />
    <script>
      try {
        const savedTheme = localStorage.getItem("tlon-agent-task-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
          document.documentElement.style.colorScheme = savedTheme;
        }
      } catch {}
    </script>
    <title>Tlon agent task rows</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #f5f5f5;
        --surface: #ffffff;
        --surface-hover: #f5f5f5;
        --ink: #1a1818;
        --ink-2: #666666;
        --ink-3: #999999;
        --line: #e5e5e5;
        --focus: #1a1818;
        --positive: #3b80e8;
        --positive-bg: #f5faff;
        --negative: #e22a2a;
        --negative-bg: #fef5f5;
        --shadow: 0 3px 18px rgba(24, 24, 24, 0.08);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-toggle: cubic-bezier(0.65, 0, 0.35, 1);
      }

      :root[data-theme="dark"] {
        --canvas: #1a1818;
        --surface: #242121;
        --surface-hover: #322e2e;
        --ink: #ffffff;
        --ink-2: #b3b3b3;
        --ink-3: #808080;
        --line: #333333;
        --focus: #ffffff;
        --positive: #4e91f5;
        --positive-bg: #143a5e;
        --negative: #e96a6a;
        --negative-bg: #4b2525;
        --shadow: 0 3px 18px rgba(255, 255, 255, 0.05);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --canvas: #1a1818;
          --surface: #242121;
          --surface-hover: #322e2e;
          --ink: #ffffff;
          --ink-2: #b3b3b3;
          --ink-3: #808080;
          --line: #333333;
          --focus: #ffffff;
          --positive: #4e91f5;
          --positive-bg: #143a5e;
          --negative: #e96a6a;
          --negative-bg: #4b2525;
          --shadow: 0 3px 18px rgba(255, 255, 255, 0.05);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--canvas);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(100%, 560px);
        min-height: 100vh;
        margin: 0 auto;
        padding: max(28px, env(safe-area-inset-top)) 20px
          max(32px, env(safe-area-inset-bottom));
      }

      .intro {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 5px;
        font-size: 17px;
        font-weight: 500;
        line-height: 24px;
      }

      .lede {
        max-width: 44ch;
        margin: 0;
        color: var(--ink-2);
        font-size: 14px;
        line-height: 22px;
      }

      button {
        border: 0;
        color: inherit;
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .replay {
        min-height: 44px;
        padding: 0 12px;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        cursor: pointer;
        font-size: 12px;
      }

      .replay:hover,
      .replay:active {
        background: var(--surface-hover);
        color: var(--ink);
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 14px;
      }

      .theme-picker {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .control-label {
        color: var(--ink-2);
        font-size: 12px;
        line-height: 1;
      }

      .segmented {
        display: inline-flex;
        gap: 2px;
        padding: 2px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--surface-hover), var(--line) 18%);
      }

      .segment {
        min-height: 44px;
        padding: 0 14px;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        cursor: pointer;
        font-size: 12px;
        transition:
          color 150ms linear,
          background-color 200ms var(--ease-out),
          box-shadow 200ms var(--ease-out);
      }

      .segment[aria-pressed="true"] {
        background: var(--surface);
        box-shadow: 0 1px 5px rgba(24, 24, 24, 0.06);
        color: var(--ink);
      }

      #task-rows {
        display: grid;
        gap: 8px;
        min-height: 196px;
      }

      #task-rows.list {
        display: block;
        min-height: 0;
        overflow: hidden;
        border-radius: 22px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .task-row {
        overflow: hidden;
        border-radius: 22px;
        background: var(--surface);
        box-shadow: var(--shadow);
        transition: border-radius 300ms var(--ease-toggle);
      }

      .task-row.open {
        border-radius: 14px;
      }

      .task-row.enter {
        animation: fade-up 450ms var(--ease-out) both;
        animation-delay: calc(var(--index) * 80ms);
      }

      .list .task-row {
        border-radius: 0;
        box-shadow: none;
      }

      .list .task-row:not(:last-child) {
        border-bottom: 1px solid var(--line);
      }

      .task-trigger {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr) auto auto 20px;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 52px;
        padding: 4px 12px;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .task-trigger:hover,
      .task-trigger:active {
        background: var(--surface-hover);
      }

      .task-title {
        min-width: 0;
        font-size: 14px;
        line-height: 20px;
      }

      .meta {
        color: var(--ink-3);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        color: var(--positive);
        background: var(--positive-bg);
        font-size: 11.5px;
        white-space: nowrap;
        animation: pop-in 300ms var(--ease-out) both;
      }

      .status-pill.failed {
        color: var(--negative);
        background: var(--negative-bg);
      }

      .status-graphic,
      .status-pill-host {
        display: contents;
      }

      .status-mark,
      .ring {
        position: relative;
        display: grid;
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
        place-items: center;
      }

      .status-mark {
        border-radius: 50%;
        background: var(--positive);
        color: var(--surface);
        animation: pop-in 300ms var(--ease-out) both;
      }

      .status-mark.failed {
        background: var(--negative);
      }

      .status-mark svg {
        width: 14px;
        height: 14px;
      }

      .ring svg {
        position: absolute;
        inset: 0;
        width: 24px;
        height: 24px;
        transform: rotate(-90deg);
      }

      .ring .track,
      .ring .arc {
        fill: none;
        stroke-width: 2;
      }

      .ring .track {
        stroke: var(--line);
      }

      .ring .arc {
        stroke: var(--ink-2);
        stroke-linecap: round;
      }

      .ring.running svg {
        animation: spin 1.1s linear infinite;
      }

      .ring.running .arc {
        stroke-dasharray: 19.35 49.77;
      }

      .ring.progress .arc {
        stroke-dasharray: 69.12 69.12;
        stroke-dashoffset: 69.12;
      }

      .ring.progress.sweep .arc {
        animation: sweep-66 650ms var(--ease-out) forwards;
      }

      .ring.pending {
        border: 1px solid var(--line);
        border-radius: 50%;
        color: var(--ink-3);
      }

      .ring-number {
        position: relative;
        color: var(--ink-2);
        font-size: 11px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .pending .ring-number {
        color: var(--ink-3);
      }

      .retry-icon {
        width: 13px;
        height: 13px;
        animation: spin 1.1s linear infinite;
      }

      .chevron {
        display: grid;
        width: 20px;
        height: 24px;
        place-items: center;
        color: var(--ink-3);
        transition: transform 300ms var(--ease-toggle);
      }

      .open .chevron {
        transform: rotate(180deg);
      }

      .chevron svg {
        width: 15px;
        height: 15px;
      }

      .details-wrap {
        display: grid;
        grid-template-rows: 0fr;
        opacity: 0;
        visibility: hidden;
        transition:
          grid-template-rows 300ms var(--ease-toggle),
          opacity 220ms linear,
          visibility 0s linear 300ms;
      }

      .open .details-wrap {
        grid-template-rows: 1fr;
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }

      .details-inner {
        min-height: 0;
        overflow: hidden;
      }

      .details {
        display: grid;
        grid-template-columns: 1px minmax(0, 1fr);
        gap: 10px;
        padding: 0 14px 14px 23px;
      }

      .connector {
        background: var(--line);
      }

      .detail-list {
        display: grid;
        gap: 8px;
      }

      .detail {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        opacity: 0;
        transform: translateY(6px);
        font-size: 12px;
        line-height: 18px;
        transition:
          opacity 180ms linear,
          transform 240ms var(--ease-out);
      }

      .open .detail {
        opacity: 1;
        transform: translateY(0);
        transition-delay: calc(60ms + var(--detail-index) * 45ms);
      }

      .detail-label {
        color: var(--ink-3);
      }

      .detail-value {
        color: var(--ink-2);
        text-align: right;
      }

      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pop-in {
        from {
          opacity: 0;
          transform: scale(0.86);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes sweep-66 {
        to {
          stroke-dashoffset: 23.5;
        }
      }

      @media (max-width: 520px) {
        .controls {
          align-items: flex-start;
          flex-direction: column;
        }

        .theme-picker {
          justify-content: space-between;
          width: 100%;
        }
      }

      @media (max-width: 420px) {
        main {
          padding-left: 14px;
          padding-right: 14px;
        }

        .task-trigger {
          grid-template-columns: 24px minmax(0, 1fr) auto 18px;
          gap: 8px;
        }

        .status-pill {
          display: none;
        }

        .segment {
          padding-right: 11px;
          padding-left: 11px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-delay: 0s !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-delay: 0s !important;
          transition-duration: 0.01ms !important;
        }

        .ring.running svg,
        .retry-icon {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="intro">
        <div>
          <h1>Agent turn activity</h1>
          <p class="lede">
            Progress stays legible while the agent works. Open any row for the
            underlying activity.
          </p>
        </div>
        <button class="replay" type="button" id="replay">Replay</button>
      </header>

      <div class="controls">
        <div class="segmented" role="group" aria-label="Task row presentation">
          <button
            class="segment"
            type="button"
            data-variant="capsules"
            aria-pressed="true"
          >
            Capsules
          </button>
          <button
            class="segment"
            type="button"
            data-variant="list"
            aria-pressed="false"
          >
            List
          </button>
        </div>
        <div class="theme-picker">
          <span class="control-label" aria-hidden="true">Theme</span>
          <div class="segmented" role="group" aria-label="Color theme">
            <button
              class="segment"
              type="button"
              data-theme-choice="system"
              aria-pressed="true"
            >
              System
            </button>
            <button
              class="segment"
              type="button"
              data-theme-choice="light"
              aria-pressed="false"
            >
              Light
            </button>
            <button
              class="segment"
              type="button"
              data-theme-choice="dark"
              aria-pressed="false"
            >
              Dark
            </button>
          </div>
        </div>
      </div>

      <section id="task-rows" aria-label="Agent tasks"></section>
    </main>

    <script>
      const ticks = [600, 900, 2400, 1400, 2400, 600];
      const taskRows = document.querySelector("#task-rows");
      const themeColor = document.querySelector("#theme-color");
      const systemDark = window.matchMedia("(prefers-color-scheme: dark)");
      const manualOpen = new Map();
      const rowElements = new Map();
      let tick = 0;
      let variant = "capsules";
      let themeChoice = "system";
      let timer;

      const check = `
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="m3.5 8.2 3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>`;
      const close = `
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="m4 4 8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>`;
      const retry = `
        <svg class="retry-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M12.4 5.4A5 5 0 1 0 13 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          <path d="M9.8 3.4h2.9v2.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>`;
      const chevron = `
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="m3.5 6 4.5 4 4.5-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>`;

      function rowsForTick() {
        const mapped = tick >= 2;
        const fixtureFailed = tick === 4;
        const fixtureDone = tick >= 5;
        return [
          {
            id: "map-events",
            sequence: 1,
            title: "Map agent turn events",
            status: mapped ? "completed" : "running",
            progress: mapped ? undefined : tick >= 1 ? 0.66 : 0,
            meta: "4 events",
            details: [
              ["Commentary", "Live progress narration"],
              ["Tools", "Calls and command output"],
              ["Lifecycle", "Started, waiting, completed"],
            ],
          },
          {
            id: "shape-rows",
            sequence: 2,
            title: "Shape Ochre task rows",
            status: mapped ? "running" : "pending",
            meta: "2 files",
            details: [
              ["Presentation", "Capsules and grouped list"],
              ["Interaction", "Tap any row to inspect details"],
              ["Motion", "Stagger, expand, and state transitions"],
            ],
          },
          {
            id: "messenger-fixture",
            sequence: 3,
            title: "Prepare Messenger fixture",
            status: fixtureDone
              ? "completed"
              : fixtureFailed
                ? "failed"
                : "pending",
            meta: "fixture",
            details: [
              ["Theme", "Light and dark Ochre tokens"],
              ["Access", "Keyboard focus and reduced motion"],
            ],
          },
        ];
      }

      function isOpen(id) {
        return manualOpen.get(id) ?? false;
      }

      function statusGraphic(row) {
        if (row.status === "completed")
          return `<span class="status-mark">${check}</span>`;
        if (row.status === "failed")
          return `<span class="status-mark failed">${close}</span>`;
        if (row.status === "pending")
          return `<span class="ring pending"><span class="ring-number">${row.sequence}</span></span>`;
        const progressClass =
          row.progress == null
            ? "running"
            : `progress ${row.progress > 0 ? "sweep" : ""}`;
        return `
          <span class="ring ${progressClass}">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle class="track" cx="12" cy="12" r="11" />
              <circle class="arc" cx="12" cy="12" r="11" />
            </svg>
            <span class="ring-number">${row.sequence}</span>
          </span>`;
      }

      function statusPill(status) {
        if (status === "completed")
          return `<span class="status-pill">Completed</span>`;
        if (status === "failed")
          return `<span class="status-pill failed">${retry}Failed</span>`;
        return "";
      }

      function detailMarkup(details) {
        return details
          .map(
            ([label, value], detailIndex) => `
              <div class="detail" style="--detail-index:${detailIndex}">
                <span class="detail-label">${label}</span>
                <span class="detail-value">${value}</span>
              </div>`,
          )
          .join("");
      }

      function createRow(row, index) {
        const template = document.createElement("template");
        template.innerHTML = `
          <article class="task-row enter" style="--index:${index}" data-id="${row.id}">
            <button class="task-trigger" type="button">
              <span class="status-graphic"></span>
              <span class="task-title"></span>
              <span class="status-pill-host"></span>
              <span class="meta"></span>
              <span class="chevron">${chevron}</span>
            </button>
            <div class="details-wrap" aria-hidden="true">
              <div class="details-inner">
                <div class="details">
                  <span class="connector" aria-hidden="true"></span>
                  <div class="detail-list"></div>
                </div>
              </div>
            </div>
          </article>`;
        const element = template.content.firstElementChild;
        rowElements.set(row.id, element);
        taskRows.append(element);
        return element;
      }

      function updateRow(element, row, index) {
        const open = isOpen(row.id);
        const trigger = element.querySelector(".task-trigger");
        const statusText =
          row.status === "completed"
            ? ", completed"
            : row.status === "failed"
              ? ", failed"
              : "";

        element.classList.toggle("open", open);
        element.style.setProperty("--index", index);
        trigger.setAttribute("aria-expanded", String(open));
        trigger.setAttribute("aria-label", `${row.title}${statusText}`);
        element
          .querySelector(".details-wrap")
          .setAttribute("aria-hidden", String(!open));
        element.querySelector(".task-title").textContent = row.title;
        element.querySelector(".meta").textContent = row.meta ?? "";

        const graphic = element.querySelector(".status-graphic");
        const graphicSignature = `${row.status}:${row.progress ?? ""}`;
        if (graphic.dataset.signature !== graphicSignature) {
          graphic.dataset.signature = graphicSignature;
          graphic.innerHTML = statusGraphic(row);
        }

        const pill = element.querySelector(".status-pill-host");
        if (pill.dataset.signature !== row.status) {
          pill.dataset.signature = row.status;
          pill.innerHTML = statusPill(row.status);
        }

        const details = element.querySelector(".detail-list");
        const detailsSignature = JSON.stringify(row.details);
        if (details.dataset.signature !== detailsSignature) {
          details.dataset.signature = detailsSignature;
          details.innerHTML = detailMarkup(row.details);
        }
      }

      function render() {
        taskRows.className = variant === "list" ? "list" : "";
        const rows = rowsForTick();
        const currentIds = new Set(rows.map((row) => row.id));

        rows.forEach((row, index) => {
          const element = rowElements.get(row.id) ?? createRow(row, index);
          const expectedElement = taskRows.children[index];
          if (expectedElement !== element) {
            taskRows.insertBefore(element, expectedElement ?? null);
          }
          updateRow(element, row, index);
        });

        rowElements.forEach((element, id) => {
          if (!currentIds.has(id)) {
            element.remove();
            rowElements.delete(id);
          }
        });
      }

      function advance() {
        if (tick >= ticks.length) return;
        timer = window.setTimeout(() => {
          tick += 1;
          render();
          advance();
        }, ticks[tick]);
      }

      function replayDemo() {
        window.clearTimeout(timer);
        tick = 0;
        manualOpen.clear();
        render();
        advance();
      }

      function applyTheme(choice) {
        themeChoice = choice;
        if (choice === "system") {
          delete document.documentElement.dataset.theme;
          document.documentElement.style.colorScheme = "light dark";
        } else {
          document.documentElement.dataset.theme = choice;
          document.documentElement.style.colorScheme = choice;
        }

        try {
          localStorage.setItem("tlon-agent-task-theme", choice);
        } catch {}

        document.querySelectorAll("[data-theme-choice]").forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.themeChoice === choice),
          );
        });

        const dark =
          choice === "dark" || (choice === "system" && systemDark.matches);
        themeColor.setAttribute("content", dark ? "#1a1818" : "#f5f5f5");
      }

      taskRows.addEventListener("click", (event) => {
        const trigger = event.target.closest(".task-trigger");
        if (!trigger) return;
        const row = trigger.closest(".task-row");
        const id = row.dataset.id;
        manualOpen.set(id, !isOpen(id));
        render();
      });

      document.querySelectorAll("[data-variant]").forEach((button) => {
        button.addEventListener("click", () => {
          variant = button.dataset.variant;
          document.querySelectorAll("[data-variant]").forEach((item) => {
            item.setAttribute("aria-pressed", String(item === button));
          });
          render();
        });
      });

      document.querySelectorAll("[data-theme-choice]").forEach((button) => {
        button.addEventListener("click", () => {
          applyTheme(button.dataset.themeChoice);
        });
      });

      systemDark.addEventListener("change", () => {
        if (themeChoice === "system") applyTheme("system");
      });

      document.querySelector("#replay").addEventListener("click", replayDemo);
      try {
        const savedTheme = localStorage.getItem("tlon-agent-task-theme");
        themeChoice = ["system", "light", "dark"].includes(savedTheme)
          ? savedTheme
          : "system";
      } catch {}
      applyTheme(themeChoice);
      render();
      advance();
    </script>
  </body>
</html>
